# AI 面部美学参考分 — deterministic geometry/harmony scorer (Issue #31, D36).
# Code: src/aesthetic_passport/scoring/. Every threshold and conversion constant lives here, so calibration can be
# patched without touching code. Changing anything that moves a score must bump `version`.
#
# Provenance of each number (details + links: docs/scoring/COMPETITOR_FORMULA.md):
#   [public]   stated on The Face Report's public tool pages
#   [inferred] derived by us from their published examples (fits the examples; their exact constant is not public)
#   [ours]     our own product calibration where nothing public exists
#
# The scale is a geometric harmony REFERENCE on one front photo. It is not a verdict on attractiveness, and it is
# not a population rank: there is no percentile here (that is Issue #41, which consumes `overall_score` only).

version: "aes-geo-1.0"
method: "35/25/25/15 geometric harmony on MediaPipe face-mesh landmarks (front photo, roll-corrected frame)"
landmark_model: "mediapipe_face_mesh_478"

reference_curve:
  points: 65
  min_bandwidth_native: 0.3

weights:                      # [public] attractiveness + psl-score pages: symmetry 35, thirds 25, fifths 25, golden 15
  symmetry: 0.35
  thirds: 0.25
  fifths: 0.25
  golden_ratio: 0.15

symmetry:
  # [public] symmetry page: a midline fitted through upper forehead, forehead centre, nose bridge, nose base and chin
  # bottom; each left point is reflected across it and the full 2D residual to its right partner is divided by the
  # pair's average distance from the midline; 12 bilateral pairs; feature weights jaw 35 / eyes 25 / brows 15 /
  # mouth 15 / nose 10. Pairs per feature are only partly listed publicly — the exact indices below are [ours].
  midline: [10, 151, 168, 2, 152]
  features:
    eyes:  {weight: 0.25, pairs: [[133, 362], [33, 263], [159, 386], [145, 374]]}   # inner, outer corner; lids
    brows: {weight: 0.15, pairs: [[107, 336], [105, 334], [70, 300]]}               # head, peak, tail
    nose:  {weight: 0.10, pairs: [[129, 358]]}                                      # outer ala
    mouth: {weight: 0.15, pairs: [[61, 291]]}                                       # commissures
    jaw:   {weight: 0.35, pairs: [[127, 356], [234, 454], [172, 397]]}              # temple, cheekbone, jaw contour
  # [inferred/ours] "fixed penalty": points lost per unit of mean normalized residual (0.05 → −20).
  penalty: 400

thirds:
  # [public] visible thirds against the face-mesh template split 18/41/41 (the hairline is not visible, so the
  # window starts at the mesh's upper-forehead point). The brow level 105/334 is [inferred]: on MediaPipe's
  # canonical mesh it reproduces 17.8 / 40.7 / 41.4 ≈ 18/41/41 exactly; glabella (9) would give 19/40/41.
  levels: {top: [10], brow: [105, 334], nose_base: [2], chin: [152]}
  reference: [0.18, 0.41, 0.41]
  # [inferred] points per unit of mean relative deviation. Fits both published examples: median scan 16/44/40 → 73
  # and the sample report 19/44/37 → 70 (both ≈ 100 − 400 × mean |share ÷ reference − 1|).
  penalty: 400

fifths:
  # [public] five eye-width segments: face edge → outer eye → inner eye → inner eye → outer eye → face edge.
  # Face edge = cheekbone contour 234/454 (the same width the golden-ratio term uses) [ours].
  cuts: [234, 33, 133, 362, 263, 454]
  # [ours] points per unit of mean |segment ÷ eye width − 1| (eye width = mean of the two eye segments). Set so a
  # typical face lands near the published median fifths score (77); the canonical mesh scores ≈ 74.
  penalty: 140

golden_ratio:
  # [public] visible face length (mesh top 10 → chin 152) ÷ cheekbone width (234 → 454); proxy target ≈ 1.38 for the
  # visible window (phi 1.618 applies to hairline → chin); "every 10 points ≈ 5 % relative deviation".
  length: [10, 152]
  width: [234, 454]
  target: 1.38
  penalty: 200

# Photo-condition gates. A component that cannot be measured honestly is null (never estimated); without all four
# components there is no overall score. Soft flags keep the score but mark it limited (never full confidence).
quality:
  full_max_yaw: 5             # |yaw| ≤ this (and pitch below) → full; the competitor's symmetry tool withholds > 2°
  limited_max_yaw: 12         # |yaw| > this → symmetry and fifths not scored (a turned head is not asymmetric)
  full_max_pitch: 10
  limited_max_pitch: 20       # |pitch| > this → thirds and golden ratio not scored (vertical proportions distorted)
  max_roll: 20                # roll is corrected by the frame; beyond this the landmark fit itself degrades
  min_face_width_px: 80       # cheekbone width in pixels below this → no score (too few pixels for 2 % effects)

# Tier bands: thresholds [public] (attractiveness page: 87 / 83 / 78 / 60); labels are our own neutral wording.
tiers:
  - {min: 87, key: t5, label_zh: "几何协调度很高"}
  - {min: 83, key: t4, label_zh: "几何协调度高"}
  - {min: 78, key: t3, label_zh: "几何协调度较高"}
  - {min: 60, key: t2, label_zh: "几何协调度中等"}
  - {min: 0,  key: t1, label_zh: "比例个性鲜明"}

