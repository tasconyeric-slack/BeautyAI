  - {id: M036, key: outer_canthal_face, name_zh: 外眦距 / 面宽, group: eyes, pillar: expression, view: front, unit: ratio, decimals: 2, tier: free, class: A, compute: outer_canthal_face, eyewear: true, pose: medium, max_confidence: high, valid_range: [0.55, 0.95],
