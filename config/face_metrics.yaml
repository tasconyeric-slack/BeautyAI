    max_confidence: high
    valid_range: [0, 15]
    definition_zh: 两侧嘴角连线与水平线的夹角（已扣除头部倾斜，不分方向）。表情会改变它。
    overlay:
      segments: [[mouth_l, mouth_r, measure], [mouth_l, mouth_hz, reference]]

  # --- 下颌与下巴 · 头脸架构 --------------------------------------------------------------------------------
  - id: M098
    key: chin_angle
    name_zh: 下巴收拢角
    group: jaw
    pillar: architecture
    view: front
    unit: deg
    decimals: 0
    tier: free
    class: B
    compute: chin_angle
    pose: medium
    max_confidence: medium
    valid_range: [80, 170]
    definition_zh: 以下巴底为顶点、连到两侧下颌转角的夹角（正面投影）。角越小下脸越收拢（偏 V），越大越宽平（偏 U）。
    overlay:
      segments: [[chin, jaw_l, measure], [chin, jaw_r, measure]]
      angles: [[jaw_l, chin, jaw_r]]
      outline: true
  - id: M090
    key: jaw_corner_angle
    name_zh: 下颌转角
    group: jaw
    pillar: architecture
    view: front
    unit: deg
    decimals: 0
    tier: full
    class: B
    compute: jaw_corner_angle
    pose: medium
    max_confidence: medium
    valid_range: [100, 175]
    definition_zh: 下颌转角处，向上（面颊轮廓）与向下（下颌线）两段轮廓的夹角，两侧平均。只是正面投影，不是骨骼角度。
    overlay:
      segments: [[ramus_l, jaw_l, measure], [jaw_l, chin, measure], [ramus_r, jaw_r, measure], [jaw_r, chin, measure]]
      angles: [[ramus_l, jaw_l, chin], [ramus_r, jaw_r, chin]]
  - id: M093
    key: chin_width_jaw
