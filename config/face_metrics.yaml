  - {id: M031, key: eye_subnasale, name_zh: 眼—鼻底纵距 / 面长, group: proportions, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: A, compute: eye_subnasale, pose: high, max_confidence: medium, valid_range: [0.12, 0.35],
     definition_zh: 两眼中心连线到鼻底的纵向距离 ÷ 额顶标志点到下巴，描述面中部的紧凑程度。,
     overlay: {segments: [[eye_mid, subnasale, measure], [forehead_top, chin, reference]]}}
  - {id: M032, key: lower_face_length, name_zh: 鼻底—下巴 / 面长, group: proportions, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: free, class: A, compute: lower_face_length, pose: medium, max_confidence: high, valid_range: [0.22, 0.5],
     definition_zh: 鼻底到下巴 ÷ 额顶标志点到下巴。不依赖发际线，刘海遮挡时也能测。,
