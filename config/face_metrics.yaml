     overlay: {segments: [[eye_l_outer, eye_r_outer, measure], [cheek_l, cheek_r, reference]]}}
  - {id: M045, key: eye_roundness, name_zh: 眼裂圆度, group: eyes, pillar: expression, view: front, unit: ratio, decimals: 2, tier: full, class: B, compute: eye_roundness, needs: [eyes_open], eyewear: true, pose: medium, max_confidence: medium, valid_range: [0.08, 0.5],
     definition_zh: 眼裂轮廓面积 ÷ 眼宽²。越高越圆，越低越细长。,
     overlay: {segments: [[eye_l_inner, eye_l_outer, measure], [eye_r_inner, eye_r_outer, measure], [eye_l_top, eye_l_bottom, reference], [eye_r_top, eye_r_bottom, reference]]}}
  - {id: M048, key: iris_exposure, name_zh: 虹膜可见比例, group: eyes, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: iris_exposure, needs: [iris, eyes_open], eyewear: true, pose: medium, max_confidence: medium, valid_range: [0.3, 1.0],
     definition_zh: 拟合虹膜圆落在上下眼睑之间的比例。受视线方向影响。,
     overlay: {segments: [[iris_l_a, iris_l_b, reference], [iris_r_a, iris_r_b, reference], [eye_l_top, eye_l_bottom, measure], [eye_r_top, eye_r_bottom, measure]], points: [iris_l, iris_r]}}
  - {id: M049, key: pupil_vertical, name_zh: 瞳孔相对眼角线高度, group: eyes, pillar: expression, view: front, unit: pct_face, decimals: 0, tier: full, class: A, compute: pupil_vertical, needs: [iris], eyewear: true, pose: high, max_confidence: medium, valid_range: [-0.3, 0.3],
     definition_zh: 虹膜中心到“内眼角—外眼角”连线的垂距 ÷ 眼宽（向上为正）。视线方向会影响它。,
     overlay: {segments: [[eye_l_inner, eye_l_outer, reference], [eye_r_inner, eye_r_outer, reference]], points: [iris_l, iris_r]}}
  - {id: M050, key: lower_scleral, name_zh: 虹膜下方留白, group: eyes, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: lower_scleral, needs: [iris, eyes_open], eyewear: true, pose: high, max_confidence: low, valid_range: [-0.6, 0.5],
     definition_zh: 下眼睑到虹膜下缘的距离 ÷ 虹膜直径（负值 = 下睑盖住虹膜下缘）。视线与表情影响很大，只作观察。,
     overlay: {points: [iris_l, iris_r, eye_l_bottom, eye_r_bottom], segments: [[iris_l_a, iris_l_b, reference], [iris_r_a, iris_r_b, reference]]}}
  - {id: BA04, key: inner_canthal_angle, name_zh: 内眦角, group: eyes, pillar: expression, view: front, unit: deg, decimals: 0, tier: full, class: B, compute: inner_canthal_angle, needs: [eyes_open], eyewear: true, pose: medium, max_confidence: medium, valid_range: [25, 120],
     definition_zh: 内眼角处上睑与下睑起始段的夹角。越小越尖，越大越圆钝。,
     overlay: {angles: [[eye_l_up_in, eye_l_inner, eye_l_lo_in], [eye_r_up_in, eye_r_inner, eye_r_lo_in]], segments: [[eye_l_inner, eye_l_up_in, measure], [eye_l_inner, eye_l_lo_in, measure], [eye_r_inner, eye_r_up_in, measure], [eye_r_inner, eye_r_lo_in, measure]]}}
  - {id: BA05, key: outer_canthal_angle, name_zh: 外眦角, group: eyes, pillar: expression, view: front, unit: deg, decimals: 0, tier: full, class: B, compute: outer_canthal_angle, needs: [eyes_open], eyewear: true, pose: medium, max_confidence: medium, valid_range: [25, 130],
     definition_zh: 外眼角处上睑与下睑末段的夹角。,
     overlay: {angles: [[eye_l_up_out, eye_l_outer, eye_l_lo_out], [eye_r_up_out, eye_r_outer, eye_r_lo_out]], segments: [[eye_l_outer, eye_l_up_out, measure], [eye_l_outer, eye_l_lo_out, measure], [eye_r_outer, eye_r_up_out, measure], [eye_r_outer, eye_r_lo_out, measure]]}}
  - {id: BA06, key: lid_apex, name_zh: 上睑最高点位置, group: eyes, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: lid_apex, needs: [eyes_open], eyewear: true, pose: medium, max_confidence: medium, valid_range: [0.15, 0.85],
     definition_zh: 上眼睑最高点在“内眼角(0)→外眼角(100%)”上的位置。偏小 = 弧顶靠内，偏大 = 弧顶靠外。,
     overlay: {segments: [[eye_l_inner, eye_l_outer, reference], [eye_r_inner, eye_r_outer, reference]], points: [eye_l_apex, eye_r_apex]}}
  # --- 眉 ---
  - {id: M058, key: brow_arch, name_zh: 眉弧高度, group: brows, pillar: expression, view: front, unit: fraction, decimals: 0, tier: free, class: B, compute: brow_arch, eyewear: true, pose: medium, max_confidence: medium, valid_range: [-0.1, 0.35],
     definition_zh: 眉峰高出“眉头—眉尾”连线的距离 ÷ 眉长。越高弧度越明显，接近 0 为平直眉。,
     overlay: {segments: [[brow_l_head, brow_l_tail, reference], [brow_r_head, brow_r_tail, reference], [brow_l_peak, brow_l_arch_foot, measure], [brow_r_peak, brow_r_arch_foot, measure]]}}
  - {id: M060, key: brow_tail_diff, name_zh: 眉尾高度差, group: symmetry, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: brow_tail_diff, eyewear: true, pose: high, max_confidence: medium, valid_range: [0, 0.6],
     definition_zh: 左右眉尾高度之差 ÷ 平均眼宽。,
     overlay: {segments: [[brow_l_tail, brow_r_tail, measure], [eye_l_center, eye_r_center, reference]]}}
  - {id: M061, key: brow_eye_length, name_zh: 眉长 / 眼宽, group: brows, pillar: expression, view: front, unit: ratio, decimals: 2, tier: full, class: B, compute: brow_eye_length, eyewear: true, pose: medium, max_confidence: medium, valid_range: [1.0, 2.6],
     definition_zh: 眉头到眉尾的长度 ÷ 同侧眼裂宽度。,
     overlay: {segments: [[brow_l_head, brow_l_tail, measure], [brow_r_head, brow_r_tail, measure], [eye_l_inner, eye_l_outer, reference], [eye_r_inner, eye_r_outer, reference]]}}
  - {id: BA08, key: brow_head_align, name_zh: 眉头与内眼角对位, group: brows, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: brow_head_align, eyewear: true, pose: medium, max_confidence: medium, valid_range: [-0.6, 0.6],
     definition_zh: 眉头相对内眼角的横向位置 ÷ 眼宽（正 = 眉头更靠近中线，负 = 眉头在内眼角外侧）。,
     overlay: {segments: [[brow_l_head, eye_l_inner, measure], [brow_r_head, eye_r_inner, measure]], points: [brow_l_head, brow_r_head, eye_l_inner, eye_r_inner]}}
  - {id: BA09, key: brow_tail_extension, name_zh: 眉尾外延, group: brows, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: brow_tail_extension, eyewear: true, pose: medium, max_confidence: medium, valid_range: [-0.5, 0.9],
     definition_zh: 眉尾超出外眼角的横向距离 ÷ 眼宽（负 = 眉尾短于外眼角）。,
     overlay: {segments: [[brow_l_tail, eye_l_outer, measure], [brow_r_tail, eye_r_outer, measure]]}}
  # --- 鼻 ---
  - {id: M063, key: alar_intercanthal, name_zh: 鼻翼宽 / 内眦距, group: nose, pillar: expression, view: front, unit: ratio, decimals: 2, tier: free, class: A, compute: alar_intercanthal, pose: medium, max_confidence: high, valid_range: [0.6, 1.6],
     definition_zh: 两侧鼻翼最宽处距离 ÷ 两内眼角距离。,
     overlay: {segments: [[alar_l, alar_r, measure], [eye_l_inner, eye_r_inner, measure]]}}
  - {id: M064, key: nose_face_length, name_zh: 鼻长 / 面长, group: nose, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: nose_face_length, pose: high, max_confidence: medium, valid_range: [0.18, 0.45],
     definition_zh: 鼻根到鼻底的纵向距离 ÷ 额顶标志点到下巴。抬头低头会改变它。,
     overlay: {segments: [[nasion, subnasale, measure], [forehead_top, chin, reference]]}}
  - {id: M065, key: nose_tip_position, name_zh: 鼻尖纵向位置, group: nose, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: nose_tip_position, pose: high, max_confidence: low, valid_range: [0.6, 1.1],
     definition_zh: 鼻根到鼻尖 ÷ 鼻根到鼻底（纵向）。正脸照里它主要随鼻尖朝向和抬头角度变化，只作观察。,
     overlay: {segments: [[nasion, nose_tip, measure], [nasion, subnasale, reference]]}}
  # --- 口唇 ---
  - {id: M077, key: mouth_alar, name_zh: 嘴宽 / 鼻翼宽, group: lips, pillar: expression, view: front, unit: ratio, decimals: 2, tier: free, class: A, compute: mouth_alar, pose: medium, max_confidence: high, valid_range: [1.0, 2.4],
     definition_zh: 两嘴角距离 ÷ 鼻翼宽。,
     overlay: {segments: [[mouth_l, mouth_r, measure], [alar_l, alar_r, measure]]}}
  - {id: BA17, key: upper_vermilion, name_zh: 上唇红高 / 嘴宽, group: lips, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: upper_vermilion, needs: [mouth_closed], pose: medium, max_confidence: medium, valid_range: [0.04, 0.3],
     definition_zh: 上唇中央红唇高度 ÷ 嘴宽。,
     overlay: {segments: [[lip_top, lip_upper_inner, measure], [mouth_l, mouth_r, reference]]}}
  - {id: M079, key: lower_vermilion, name_zh: 下唇红高 / 嘴宽, group: lips, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: lower_vermilion, needs: [mouth_closed], pose: medium, max_confidence: medium, valid_range: [0.05, 0.35],
     definition_zh: 下唇中央红唇高度 ÷ 嘴宽。,
     overlay: {segments: [[lip_lower_inner, lip_bottom, measure], [mouth_l, mouth_r, reference]]}}
  - {id: M082, key: bow_peak_distance, name_zh: 唇峰间距 / 嘴宽, group: lips, pillar: expression, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: bow_peak_distance, pose: medium, max_confidence: medium, valid_range: [0.12, 0.6],
     definition_zh: 左右唇峰之间的距离 ÷ 嘴宽。,
     overlay: {segments: [[bow_l, bow_r, measure], [mouth_l, mouth_r, reference]]}}
  - {id: M086, key: lip_midline_offset, name_zh: 唇中线偏移, group: symmetry, pillar: harmony, view: front, unit: pct_face, decimals: 1, tier: full, class: A, compute: lip_midline_offset, pose: high, max_confidence: medium, valid_range: [0, 0.12],
     definition_zh: 上唇中点到面部对称轴的横向距离 ÷ 颧宽。,
     overlay: {segments: [[lip_top, lip_top_axis, measure], [midline_top, midline_bottom, reference]]}}
  - {id: BA10, key: mouth_ipd, name_zh: 嘴宽 / 瞳距, group: lips, pillar: expression, view: front, unit: ratio, decimals: 2, tier: full, class: B, compute: mouth_ipd, needs: [iris], pose: medium, max_confidence: medium, valid_range: [0.6, 1.5],
     definition_zh: 两嘴角距离 ÷ 两瞳孔（虹膜中心）距离。,
     overlay: {segments: [[mouth_l, mouth_r, measure], [iris_l, iris_r, measure]]}}
  # --- 下颌与下巴 ---
  - {id: M091, key: jaw_line_slope, name_zh: 下颌缘倾角, group: jaw, pillar: architecture, view: front, unit: deg, decimals: 0, tier: free, class: A, compute: jaw_line_slope, pose: medium, max_confidence: medium, valid_range: [5, 75],
     definition_zh: 下颌角到下巴连线与水平线的夹角（左右平均）。越大下颌线越陡、下脸越收。,
     overlay: {angles: [[jaw_l_hz, jaw_l, chin], [jaw_r_hz, jaw_r, chin]], segments: [[jaw_l, chin, measure], [jaw_r, chin, measure], [jaw_l, jaw_l_hz, reference], [jaw_r, jaw_r_hz, reference]]}}
  - {id: M094, key: chin_tip_angle, name_zh: 下巴尖角, group: jaw, pillar: architecture, view: front, unit: deg, decimals: 0, tier: full, class: B, compute: chin_tip_angle, pose: medium, max_confidence: medium, valid_range: [90, 178],
     definition_zh: 下巴最低点处，两侧下巴轮廓近端点形成的夹角。越小下巴越尖，越大越平圆。,
     overlay: {angles: [[chin_l2, chin, chin_r2]], segments: [[chin_l2, chin, measure], [chin_r2, chin, measure]]}}
  - {id: M095, key: cheek_contour_angle, name_zh: 面颊轮廓转折角, group: jaw, pillar: architecture, view: front, unit: deg, decimals: 0, tier: full, class: B, compute: cheek_contour_angle, pose: medium, max_confidence: medium, valid_range: [120, 180],
     definition_zh: 颧点—下颌支—下颌角三点在下颌支处的夹角。越接近 180° 面颊越平直。,
     overlay: {angles: [[cheek_l, ramus_l, jaw_l], [cheek_r, ramus_r, jaw_r]], segments: [[cheek_l, ramus_l, measure], [ramus_l, jaw_l, measure], [cheek_r, ramus_r, measure], [ramus_r, jaw_r, measure]]}}
  - {id: M096, key: zygomatic_turn, name_zh: 颧部轮廓转折角, group: overall, pillar: architecture, view: front, unit: deg, decimals: 0, tier: full, class: B, compute: zygomatic_turn, pose: medium, max_confidence: medium, valid_range: [120, 180],
     definition_zh: 太阳穴—颧点—下颌支三点在颧点处的夹角。越小颧部外轮廓越“转折”。,
     overlay: {angles: [[temple_l, cheek_l, ramus_l], [temple_r, cheek_r, ramus_r]], segments: [[temple_l, cheek_l, measure], [cheek_l, ramus_l, measure], [temple_r, cheek_r, measure], [cheek_r, ramus_r, measure]]}}
  # --- 左右对称 ---
  - {id: M106, key: inner_canthus_height, name_zh: 内眦高度差, group: symmetry, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: A, compute: inner_canthus_height, eyewear: true, pose: high, max_confidence: medium, valid_range: [0, 0.4],
     definition_zh: 左右内眼角的高度差 ÷ 平均眼宽（已扣除头部倾斜）。,
     overlay: {segments: [[eye_l_inner, eye_r_inner, measure]]}}
  - {id: M108, key: brow_arch_asym, name_zh: 眉弧左右差, group: symmetry, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: brow_arch_asym, eyewear: true, pose: high, max_confidence: medium, valid_range: [0, 0.3],
     definition_zh: 左右“眉弧高度”之差。,
     overlay: {segments: [[brow_l_head, brow_l_tail, reference], [brow_r_head, brow_r_tail, reference], [brow_l_peak, brow_l_arch_foot, measure], [brow_r_peak, brow_r_arch_foot, measure]]}}
  - {id: M113, key: contour_symmetry, name_zh: 脸部轮廓对称指数, group: symmetry, pillar: harmony, view: front, unit: pct_face, decimals: 1, tier: free, class: A, compute: contour_symmetry, pose: high, max_confidence: medium, valid_range: [0, 0.2],
     definition_zh: 脸部外轮廓左右对应点镜像后的平均偏差 ÷ 颧宽。越小越对称。,
     overlay: {segments: [[midline_top, midline_bottom, reference]], outline: true}}
  - {id: BA11, key: jaw_asym, name_zh: 下颌左右宽差, group: symmetry, pillar: harmony, view: front, unit: pct_face, decimals: 1, tier: full, class: A, compute: jaw_asym, pose: high, max_confidence: medium, valid_range: [0, 0.2],
     definition_zh: 左右下颌角到对称轴的距离之差 ÷ 颧宽。,
     overlay: {segments: [[jaw_l, jaw_l_axis, measure], [jaw_r, jaw_r_axis, measure], [midline_top, midline_bottom, reference]]}}
  - {id: BA12, key: cheek_asym, name_zh: 颧部左右宽差, group: symmetry, pillar: harmony, view: front, unit: pct_face, decimals: 1, tier: full, class: A, compute: cheek_asym, pose: high, max_confidence: medium, valid_range: [0, 0.2],
     definition_zh: 左右颧点到对称轴的距离之差 ÷ 颧宽。,
     overlay: {segments: [[cheek_l, cheek_l_axis, measure], [cheek_r, cheek_r_axis, measure], [midline_top, midline_bottom, reference]]}}
  - {id: BA13, key: chin_offset, name_zh: 下巴中线偏移, group: symmetry, pillar: harmony, view: front, unit: pct_face, decimals: 1, tier: full, class: A, compute: chin_offset, pose: high, max_confidence: medium, valid_range: [0, 0.15],
     definition_zh: 下巴最低点到面部对称轴的横向距离 ÷ 颧宽。,
     overlay: {segments: [[chin, chin_axis, measure], [midline_top, midline_bottom, reference]]}}
  # --- 皮相与拍摄 · 色彩对比 ---
  - {id: M138, key: skin_redness, name_zh: 肤色红绿倾向, group: skin, pillar: skin, view: front, unit: lab_a, decimals: 0, tier: full, class: B, compute: skin_redness, needs: [color], pose: low, max_confidence: medium, valid_range: [-10, 40],
     definition_zh: 肤色取样的 Lab a*（越大越偏红）。只是本张照片的颜色观察，不判断皮肤状态。,
     overlay: {points: [cheek_sample_l, cheek_sample_r]}}
  - {id: BA16, key: skin_chroma, name_zh: 肤色饱和度, group: skin, pillar: skin, view: front, unit: lab_c, decimals: 0, tier: full, class: B, compute: skin_chroma, needs: [color], pose: low, max_confidence: medium, valid_range: [0, 60],
     definition_zh: 肤色取样的 Lab 彩度 C*（越高颜色越浓）。配色时用来判断适合清透还是浓郁的颜色。,
     overlay: {points: [cheek_sample_l, cheek_sample_r]}}
  - {id: M156, key: hair_lightness, name_zh: 发色明度, group: skin, pillar: skin, view: front, unit: lab_l, decimals: 0, tier: full, class: B, compute: hair_lightness, needs: [color], pose: low, max_confidence: medium, valid_range: [0, 100],
     definition_zh: 头发取样的 Lab 明度 L*（0 黑 → 100 白）。,
     overlay: {}}
  - {id: M157, key: brow_hair_contrast, name_zh: 眉发明度差, group: skin, pillar: skin, view: front, unit: lab_l, decimals: 0, tier: full, class: B, compute: brow_hair_contrast, needs: [color], pose: low, max_confidence: medium, valid_range: [0, 80],
     definition_zh: 眉毛与头发取样的明度差。差值小说明眉色与发色统一。,
     overlay: {points: [brow_l_peak, brow_r_peak]}}
  - {id: M158, key: skin_hair_contrast, name_zh: 肤发明度对比, group: skin, pillar: skin, view: front, unit: lab_l, decimals: 0, tier: free, class: B, compute: skin_hair_contrast, needs: [color], pose: low, max_confidence: medium, valid_range: [-40, 95],
     definition_zh: 肤色明度减去发色明度。对比越大，整体越适合清晰、对比强的配色。,
     overlay: {points: [cheek_sample_l, cheek_sample_r]}}
  - {id: BA14, key: lip_skin_contrast, name_zh: 唇色与肤色色差, group: skin, pillar: skin, view: front, unit: delta_e, decimals: 0, tier: full, class: B, compute: lip_skin_contrast, needs: [color], pose: low, max_confidence: medium, valid_range: [0, 70],
     definition_zh: 唇部与面颊取样颜色的 ΔE（CIE76）。差值小的人，裸色唇妆会显得“没涂”。,
     overlay: {points: [cheek_sample_l, cheek_sample_r, lip_top, lip_bottom]}}
  - {id: M149, key: skin_texture, name_zh: 皮肤纹理保留度, group: skin, pillar: skin, view: front, unit: ratio, decimals: 1, tier: full, class: B, compute: skin_texture, pose: low, max_confidence: medium, valid_range: [0, 30],
     definition_zh: 两颊局部梯度的中位数。接近 0 往往说明开了美颜或强力磨皮，此时肤色与质感判断会更保守。,
     overlay: {points: [cheek_sample_l, cheek_sample_r]}}
  - {id: M150, key: feature_edge_width, name_zh: 五官边缘清晰度, group: skin, pillar: skin, view: front, unit: px, decimals: 1, tier: full, class: B, compute: feature_edge_width, pose: low, max_confidence: high, valid_range: [0.5, 20],
     definition_zh: 眼、眉、唇最锐利边缘的宽度（像素，越小越清晰）。超过约 5 像素会影响细节测量。,
     overlay: {points: [eye_l_outer, eye_r_outer, mouth_l, mouth_r]}}
  # --- 发量与发型轮廓（描述当前发型，不是建议）---
  - {id: M153, key: hair_coverage, name_zh: 发量视觉覆盖, group: hair, pillar: architecture, view: front, unit: ratio, decimals: 2, tier: full, class: B, compute: hair_coverage, needs: [hair], pose: low, max_confidence: medium, valid_range: [0.02, 6],
     definition_zh: 照片中头发区域面积 ÷ 脸部轮廓面积。取决于当前发型和取景，只描述这张照片。,
     overlay: {outline: true}}
  - {id: M154, key: hair_silhouette_aspect, name_zh: 头型外廓宽高比, group: hair, pillar: architecture, view: front, unit: ratio, decimals: 2, tier: full, class: B, compute: hair_silhouette_aspect, needs: [hair], pose: low, max_confidence: medium, valid_range: [0.4, 1.6],
     definition_zh: 头发 + 脸部外廓的宽 ÷ 高。描述当前发型带来的整体外轮廓。,
     overlay: {outline: true}}
  - {id: M155, key: hair_side_volume, name_zh: 两侧发量宽度, group: hair, pillar: architecture, view: front, unit: ratio, decimals: 2, tier: free, class: B, compute: hair_side_volume, needs: [hair], pose: medium, max_confidence: medium, valid_range: [0.8, 2.2],
     definition_zh: 太阳穴高度处头发 + 脸的总宽 ÷ 颧宽。越大两侧越蓬松。,
     overlay: {segments: [[temple_l, temple_r, reference]], outline: true}}

  # ============================================================================================================
  # 侧脸（需要一张真实的 ~90° 侧脸照；45° 照不算）。V3B (D35)：轮廓来自人像分割的前缘，在“眉间—颏前点”面部平面坐标
  # 里找极值点；所有数值都是内角或长度比，不受抬头 / 低头的平面内旋转影响。没有深度、没有毫米。
  # `min_arm_px`：参与计算的最短线段（原图像素）低于它 → 分辨率不足，本项不测。
  # ============================================================================================================
  - {id: M117, key: nasolabial_angle, name_zh: 鼻唇角, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: free, class: B, compute: nasolabial_angle, pose: high, max_confidence: medium, valid_range: [60, 150], min_arm_px: 12,
     definition_zh: 鼻小柱方向（鼻底→鼻小柱）与上唇方向（鼻底→上唇最突点）在鼻底处的夹角。,
     overlay: {angles: [[p_columella, p_subnasale, p_labrale_sup]], segments: [[p_subnasale, p_columella, measure], [p_subnasale, p_labrale_sup, measure]], points: [p_pronasale], silhouette: true}}
  - {id: M118, key: nasofrontal_angle, name_zh: 鼻额角, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: full, class: B, compute: nasofrontal_angle, pose: high, max_confidence: medium, valid_range: [100, 175], min_arm_px: 20,
     definition_zh: 眉间—鼻根连线与鼻背线在鼻根处的夹角。,
     overlay: {angles: [[p_glabella, p_nasion, p_dorsum_tip]], segments: [[p_glabella, p_nasion, measure], [p_dorsum_top, p_dorsum_tip, measure]], silhouette: true}}
  - {id: M119, key: dorsum_convexity, name_zh: 鼻背凸度, group: profile, pillar: architecture, view: side, unit: pct_face, decimals: 1, tier: full, class: B, compute: dorsum_convexity, pose: high, max_confidence: medium, valid_range: [-0.15, 0.2], min_arm_px: 30,
     definition_zh: 鼻背轮廓偏离“鼻根—鼻尖”连线最远的距离 ÷ 该连线长度（正 = 驼峰样凸起，负 = 凹）。,
     overlay: {segments: [[p_nasion, p_pronasale, reference], [p_dorsum_peak, p_dorsum_peak_foot, measure]], silhouette: true}}
  - {id: M121, key: nasal_projection, name_zh: 鼻尖突出度, group: profile, pillar: architecture, view: side, unit: ratio, decimals: 2, tier: full, class: B, compute: nasal_projection, pose: high, max_confidence: medium, valid_range: [0.1, 0.9], min_arm_px: 25,
     definition_zh: 鼻尖到“鼻根—鼻底”连线的垂距 ÷ 鼻根到鼻底的长度。,
     overlay: {segments: [[p_nasion, p_subnasale, reference], [p_pronasale, p_foot_prn_ns, measure]], silhouette: true}}
  - {id: M124, key: s_line_upper, name_zh: 上唇相对鼻底—颏线, group: profile, pillar: architecture, view: side, unit: pct_face, decimals: 1, tier: full, class: B, compute: s_line_upper, pose: high, max_confidence: medium, valid_range: [-0.2, 0.35], min_arm_px: 25,
     definition_zh: 上唇最突点到“鼻底—颏前点”连线的有符号距离 ÷ 该连线长度（正 = 在线前方）。,
     overlay: {segments: [[p_sline_a, p_sline_b, reference], [p_labrale_sup, p_foot_ls_s, measure]], points: [p_subnasale, p_pogonion], silhouette: true}}
  - {id: M125, key: e_line_upper, name_zh: E 线 · 上唇, group: profile, pillar: architecture, view: side, unit: pct_face, decimals: 1, tier: free, class: B, compute: e_line_upper, pose: high, max_confidence: medium, valid_range: [-0.25, 0.2], min_arm_px: 30,
     definition_zh: 上唇最突点到“鼻尖—颏前点”连线（E 线）的有符号距离 ÷ E 线长度（负 = 在线后方）。,
     overlay: {segments: [[p_eline_a, p_eline_b, reference], [p_labrale_sup, p_foot_ls_e, measure]], points: [p_pronasale, p_pogonion], silhouette: true}}
  - {id: M126, key: e_line_lower, name_zh: E 线 · 下唇, group: profile, pillar: architecture, view: side, unit: pct_face, decimals: 1, tier: free, class: B, compute: e_line_lower, pose: high, max_confidence: medium, valid_range: [-0.25, 0.2], min_arm_px: 30,
     definition_zh: 下唇最突点到 E 线的有符号距离 ÷ E 线长度（负 = 在线后方）。,
     overlay: {segments: [[p_eline_a, p_eline_b, reference], [p_labrale_inf, p_foot_li_e, measure]], points: [p_pronasale, p_pogonion], silhouette: true}}
  - {id: M127, key: mentolabial_angle, name_zh: 颏唇角, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: full, class: B, compute: mentolabial_angle, pose: high, max_confidence: medium, valid_range: [70, 175], min_arm_px: 12,
     definition_zh: 下唇最突点—颏唇沟—颏前点三点在颏唇沟处的夹角。,
     overlay: {angles: [[p_labrale_inf, p_sulcus, p_pogonion]], segments: [[p_sulcus, p_labrale_inf, measure], [p_sulcus, p_pogonion, measure]], silhouette: true}}
  - {id: M128, key: chin_projection, name_zh: 颏部前突, group: profile, pillar: architecture, view: side, unit: pct_face, decimals: 1, tier: full, class: B, compute: chin_projection, pose: high, max_confidence: medium, valid_range: [-0.4, 0.25], min_arm_px: 40,
     definition_zh: 颏前点到“鼻根—鼻底”延长线的有符号距离 ÷ 鼻根到颏下点（正 = 在线前方）。,
     overlay: {segments: [[p_nasion, p_ns_bottom, reference], [p_pogonion, p_foot_pog_ns, measure]], silhouette: true}}
  - {id: M131, key: facial_convexity, name_zh: 面部侧轮廓凸度, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: free, class: B, compute: facial_convexity, pose: high, max_confidence: medium, valid_range: [140, 190], min_arm_px: 30,
     definition_zh: 眉间—鼻底—颏前点在鼻底处的夹角（180° = 三点一线；越小侧面越凸）。,
     overlay: {angles: [[p_glabella, p_subnasale, p_pogonion]], segments: [[p_glabella, p_subnasale, measure], [p_subnasale, p_pogonion, measure]], silhouette: true}}
  - {id: BA01, key: nasomental_angle, name_zh: 鼻颏角, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: full, class: B, compute: nasomental_angle, pose: high, max_confidence: medium, valid_range: [100, 160], min_arm_px: 30,
     definition_zh: 鼻背线与“鼻尖—颏前点”连线在鼻尖处的夹角。,
     overlay: {angles: [[p_dorsum_top, p_pronasale, p_pogonion]], segments: [[p_dorsum_top, p_pronasale, measure], [p_pronasale, p_pogonion, measure]], silhouette: true}}
  - {id: BA02, key: nasofacial_angle, name_zh: 鼻面角, group: profile, pillar: architecture, view: side, unit: deg, decimals: 0, tier: full, class: B, compute: nasofacial_angle, pose: high, max_confidence: medium, valid_range: [15, 55], min_arm_px: 25,
     definition_zh: 鼻背线与面部平面（眉间—颏前点）的夹角，描述鼻子从脸上“伸出”的角度。,
     overlay: {segments: [[p_dorsum_top, p_dorsum_tip, measure], [p_fp_top, p_fp_bottom, reference]], silhouette: true}}
  - {id: BA03, key: lower_face_profile, name_zh: 侧面上唇段 / 下面部, group: profile, pillar: harmony, view: side, unit: fraction, decimals: 0, tier: full, class: B, compute: lower_face_profile, pose: high, max_confidence: medium, valid_range: [0.15, 0.5], min_arm_px: 12,
     definition_zh: 沿面部平面方向，鼻底→口裂 ÷ 鼻底→颏下点。,
     overlay: {segments: [[p_subnasale, p_stomion, measure], [p_subnasale, p_gnathion, reference]], silhouette: true}}

  # ============================================================================================================
  # 微笑（需要微笑照，并以中性正脸为基准；微笑几何从不进入中性比例）
  # ============================================================================================================
  - {id: BA20, key: smile_width, name_zh: 微笑展开幅度, group: smile, pillar: expression, view: smile, unit: ratio, decimals: 2, tier: free, class: B, compute: smile_width, pose: medium, max_confidence: medium, valid_range: [0.8, 1.7],
     definition_zh: 微笑时的嘴宽/颧宽 ÷ 中性表情的嘴宽/颧宽。,
     overlay: {segments: [[mouth_l, mouth_r, measure], [cheek_l, cheek_r, reference]]}}
  - {id: BA21, key: smile_corner_lift, name_zh: 微笑嘴角上扬角, group: smile, pillar: expression, view: smile, unit: deg, decimals: 0, tier: full, class: B, compute: smile_corner_lift, pose: medium, max_confidence: medium, valid_range: [-30, 45],
     definition_zh: 口裂中点到两侧嘴角的连线与水平线的夹角（向上为正，左右平均）。,
     overlay: {segments: [[stomion, mouth_l, measure], [stomion, mouth_r, measure], [mouth_l, mouth_hz, reference]]}}
  - {id: BA22, key: smile_symmetry, name_zh: 微笑左右高度差, group: smile, pillar: expression, view: smile, unit: fraction, decimals: 0, tier: full, class: B, compute: smile_symmetry, pose: high, max_confidence: medium, valid_range: [0, 0.3],
     definition_zh: 微笑时左右嘴角高度差 ÷ 嘴宽（已扣除头部倾斜）。,
     overlay: {segments: [[mouth_l, mouth_r, measure], [mouth_l, mouth_hz, reference]]}}
  - {id: BA23, key: smile_eye_narrowing, name_zh: 笑眼程度, group: smile, pillar: expression, view: smile, unit: ratio, decimals: 2, tier: full, class: B, compute: smile_eye_narrowing, pose: medium, max_confidence: medium, valid_range: [0.2, 1.4],
     definition_zh: 微笑时的眼睛开合度 ÷ 中性表情的开合度。越低笑起来眼睛越弯。,
     overlay: {segments: [[eye_l_top, eye_l_bottom, measure], [eye_r_top, eye_r_bottom, measure]]}}

# Public labels with no published formula. They are NOT computed and NOT shown until a grounded definition exists
# (a new DECISIONS entry). Kept here so nobody "fills them in" by guessing.
research_candidates:
  - {id: M008, name_zh: 下颌额角, note: 名称可能指额颌角或正面下颌角；锚点与公式未公开。}
  - {id: M074, name_zh: 同侧鼻翼角, note: 锚点及几何定义未公开。}
  - {id: M116, name_zh: IAA 与 JFA 偏差, note: 缩写未释义，不按猜测实现。}

# Every row of the 176-candidate research pool (docs/v3a/facial_metric_catalog_v1.csv) has exactly one status:
#   computed   — a metric above uses this id (listed automatically, not repeated here)
#   covered    — numerically the same information as an implemented metric (`by`), so not computed twice
#   deferred   — computable in principle but needs a model / segmentation / view we do not have yet
#   qualitative — a description, not a number; stays text-only (or in the model's analysis)
#   excluded   — out of scope (skin-health-adjacent observations; invariant 5)
#   meta       — about the analysis itself (coverage, stability, advice mapping), not a facial measurement
# tests/test_face_metrics.py checks that all 176 ids are classified exactly once.
catalog_status:
  M004: {status: covered, by: M003, note: 颞宽与颧宽之比已覆盖。}
  M008: {status: deferred, note: 公开名称但公式未公开（见 research_candidates）。}
  M009: {status: covered, by: M003, note: 颧颞宽相对差 = 1 − 颞宽/颧宽。}
