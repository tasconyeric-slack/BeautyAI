    pillar: skin
    view: front
    unit: ratio
    decimals: 2
    tier: full
    class: A
    compute: mouth_opening
    pose: low
    max_confidence: high
    valid_range: [0, 0.8]
    definition_zh: 上下唇内缘距离 ÷ 嘴宽。超过 0.08 视为张嘴，唇部比例不测量。
    overlay:
      segments: [[lip_upper_inner, lip_lower_inner, measure], [mouth_l, mouth_r, reference]]

  # ============================================================================================================
  # V3B (D35) — additional front definitions. Same rules: our own formulas on MediaPipe landmarks, relative values.
  # `eyewear: true` = eye / brow landmarks a glasses frame can disturb: measured on the glasses-free photo when one
  # was supplied, otherwise on the front photo with confidence capped at low and an eyewear note.
  # ============================================================================================================
  # --- 整体轮廓 ---
  - {id: M002, key: face_width_iris, name_zh: 面宽 / 虹膜直径, group: overall, pillar: architecture, view: front, unit: ratio, decimals: 1, tier: full, class: A, compute: face_width_iris, needs: [iris], pose: medium, max_confidence: medium, valid_range: [8, 22],
     definition_zh: 颧骨处脸宽 ÷ 平均虹膜直径。成人虹膜大小相对稳定，可作为不依赖拍摄距离的尺度参照（仍不是毫米）。,
     overlay: {segments: [[cheek_l, cheek_r, measure], [iris_l_a, iris_l_b, measure], [iris_r_a, iris_r_b, measure]]}}
  - {id: M003, key: temple_cheek, name_zh: 颞宽 / 颧宽, group: overall, pillar: architecture, view: front, unit: ratio, decimals: 2, tier: free, class: B, compute: temple_cheek, pose: medium, max_confidence: medium, valid_range: [0.8, 1.15],
     definition_zh: 太阳穴外缘（耳屏前）宽度 ÷ 颧骨处脸宽。数值越接近 1，上半脸外轮廓越饱满。,
     overlay: {segments: [[temple_l, temple_r, measure], [cheek_l, cheek_r, reference]], outline: true}}
  - {id: M011, key: mouth_level_width, name_zh: 口角高度脸宽 / 颧宽, group: overall, pillar: architecture, view: front, unit: ratio, decimals: 2, tier: full, class: A, compute: mouth_level_width, pose: medium, max_confidence: high, valid_range: [0.6, 1.1],
     definition_zh: 嘴角高度处的脸部外轮廓宽度 ÷ 颧宽，描述面颊下半段的收窄程度。,
     overlay: {segments: [[face_mouth_l, face_mouth_r, measure], [cheek_l, cheek_r, reference]], outline: true}}
  - {id: M169, key: feature_concentration, name_zh: 五官集中度, group: overall, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: A, compute: feature_concentration, pose: medium, max_confidence: medium, valid_range: [0.2, 0.75],
     definition_zh: 眉、眼、鼻、嘴关键点的外接矩形面积 ÷ 脸部外轮廓面积。越高，五官在脸上占的面积越大、越“舒展”。,
     overlay: {points: [brow_l_tail, brow_r_tail, brow_l_head, brow_r_head, eye_l_outer, eye_r_outer, alar_l, alar_r, mouth_l, mouth_r, lip_bottom], outline: true}}
  - {id: M170, key: feature_center, name_zh: 五官重心高度, group: overall, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: B, compute: feature_center, pose: high, max_confidence: medium, valid_range: [0.35, 0.75],
     definition_zh: 五官关键点的平均高度在“额顶标志点→下巴”之间的位置（0 = 额顶，100% = 下巴）。,
     overlay: {segments: [[forehead_top, chin, reference]], points: [brow_l_tail, brow_r_tail, eye_l_outer, eye_r_outer, alar_l, alar_r, mouth_l, mouth_r, lip_bottom]}}
