# Face measurement registry (V3A, D34). Read by src/aesthetic_passport/face_metrics/ → passport.measurement_profile.
#
# Each metric is OUR OWN definition on MediaPipe FaceLandmarker landmarks (478 points). Ids follow the candidate
# catalog in docs/v3a/facial_metric_catalog_v1.csv; the catalog is a research pool, not a claim that a metric exists in
# any other product. Labels whose formula is not public stay in `research_candidates` and are never computed.
#
# Rules of the registry (tests/test_face_metrics.py enforces them):
#   - values are relative (ratios, fractions, angles); never millimetres, never a score, never clamped;
#   - a value outside `valid_range` means the landmarks are not trustworthy → value null, reason out_of_range;
#   - every overlay point name exists in POINTS / helper points (face_metrics/points.py);
#   - `tier: free` metrics stay in the free view; `full` ones are trimmed server-side (D27/D33).
#
# Fields: id · key · name_zh · group · pillar · view (front|side) · unit · decimals · tier · class (A|B)
#   compute (function in face_metrics/compute.py) · needs (hairline|iris|mouth_closed|eyes_open|color)
#   pose (low|medium|high sensitivity to head turn) · max_confidence · valid_range · definition_zh
#   overlay: segments [[from, to, measure|reference]], angles [[arm, vertex, arm]], points [..], outline (face oval)

version: "face-metrics-0.2"
method: "mediapipe_face_landmarker_478"

# Display units. `percent` values are stored as fractions (0.34) and shown ×100.
units:
  ratio: {suffix: "", zh: "比值"}
  fraction: {suffix: "%", zh: "占比", percent: true}
  deg: {suffix: "°", zh: "角度"}
  pct_face: {suffix: "%", zh: "脸宽的百分比", percent: true}
  lab_l: {suffix: "", zh: "L*"}
  lab_b: {suffix: "", zh: "b*"}
  delta_e: {suffix: "", zh: "ΔE"}
  lab_a: {suffix: "", zh: "a*"}
  lab_c: {suffix: "", zh: "C*"}
  px: {suffix: " px", zh: "像素"}

groups:
  - {key: overall, name_zh: 整体轮廓}
  - {key: proportions, name_zh: 三庭五眼}
  - {key: eyes, name_zh: 眼}
  - {key: brows, name_zh: 眉}
  - {key: nose, name_zh: 鼻}
  - {key: lips, name_zh: 口唇}
  - {key: jaw, name_zh: 下颌与下巴}
  - {key: symmetry, name_zh: 左右对称}
  - {key: skin, name_zh: 皮相与拍摄}
  - {key: hair, name_zh: 发型轮廓}
  - {key: profile, name_zh: 侧脸轮廓}
  - {key: smile, name_zh: 微笑表情}

# Four public-facing domains. A metric belongs to exactly one for display; none of them is a score.
pillars:
  - key: harmony
    name_zh: 比例与和谐
    about_zh: 各区域在纵向、横向上的分配，以及左右是否一致。比例描述的是“你的结构”，不存在必须达到的标准值。
  - key: architecture
    name_zh: 头脸架构
    about_zh: 额、颧、下颌三处宽度与下巴的轮廓走向，决定发型外轮廓和领口该往哪里补、往哪里收。
  - key: expression
    name_zh: 五官线条
    about_zh: 眼角、眉形、唇形与鼻部的角度和比例，影响柔和或利落的观感，是妆容和眉形建议的依据。不涉及性别判断。
  - key: skin
    name_zh: 皮相与拍摄
    about_zh: 当前照片里的肤色明度、冷暖倾向与左右光线。受光线与相机影响，只作参考；不判断皮肤健康。

# Confidence = min(pose level, max_confidence, data level). Pose level from |yaw| and |pitch| × sensitivity factor.
confidence:
  yaw_high_below: 6
  yaw_medium_below: 12
  pitch_high_below: 10
  pitch_medium_below: 20
  sensitivity_factor: {low: 1.0, medium: 1.5, high: 2.0}
  unknown_pose: medium          # no transformation matrix → at most medium

# Expression / capture gates.
gates:
  mouth_open_ratio: 0.08        # inner-lip gap ÷ mouth width above this → lip metrics not measured
  eyes_closed_ratio: 0.12       # lid gap ÷ eye width below this (either eye) → eye-opening metrics not measured
  symmetry_max_yaw: 12          # |yaw| above this → symmetry metrics not measured (a turned head looks asymmetric)
  cheek_disc_frac: 0.09         # cheek sample disc radius × cheekbone width (left / right light balance)
  min_cheek_pixels: 150

missing_reasons_zh:
  upper_third_occluded: 额头被刘海或头发遮住，上庭不测量（不会用其他两段凑成 100%）。
  hairline_not_found: 没有找到清晰的发际线，涉及上庭的项目不测量。
  no_iris: 这张照片没有可用的虹膜定位，涉及瞳孔与虹膜的项目不测量。
  mouth_open: 照片中嘴唇是张开的，唇部比例不测量。闭唇、放松时重拍可补上。
  eyes_closed: 照片中眼睛接近闭合，眼部开合相关项目不测量。
  pose_off_axis: 头部转动较大，左右对称类项目不测量（转头本身就会让两侧看起来不一样）。
  out_of_range: 计算结果超出可信范围，可能是关键点定位偏差，本项不显示数字。
  color_unavailable: 肤色取样不足（遮挡或光线问题），本项不测量。
  needs_side_photo: 需要一张接近 90° 的侧脸照（只露出一侧脸、鼻尖在轮廓线上）。不会用正脸推算侧脸数值。
  side_photo_rejected: 上传的侧脸照没有通过质检（角度、分辨率或遮挡），侧脸项目不测量。可以按提示重拍后补充。
  side_not_true_profile: 这张侧脸照更接近 45° 半侧面（能看到另一侧脸颊），不是 90° 侧脸，侧脸项目不测量。
  resolution_too_low: 这一项涉及的结构在照片上只有很少的像素，误差会过大，本项不测。请上传原图或更近的照片。
  landmarks_unclear: 侧面轮廓上找不到清晰的鼻、唇、下巴转折（可能被头发、手或衣领挡住，或背景与皮肤颜色太接近）。
  lips_unclear: 侧面轮廓上分不清上下唇，唇部相关的侧脸项目不测量。
  needs_smile_photo: 需要一张正面微笑照（与中性正脸同样角度），微笑项目只在微笑照上测量。
  smile_photo_rejected: 微笑照没有通过质检，微笑项目不测量。
  hair_unavailable: 没有检测到足够的头发区域（或被裁掉了），发型轮廓项目不测量。
  no_face: 正脸照未能测量。

metrics:
  # --- 整体轮廓 · 头脸架构 -----------------------------------------------------------------------------
  - id: M001
    key: face_length_width
    name_zh: 面长宽比
    group: overall
    pillar: architecture
    view: front
    unit: ratio
    decimals: 2
    tier: free
    class: A
    compute: face_length_width
    pose: medium
    max_confidence: high
    valid_range: [0.8, 2.2]
    definition_zh: 额顶标志点到下巴的长度 ÷ 颧骨处脸宽。额顶标志点不是发际线，所以这是“标志点面长”。
    overlay:
      segments: [[forehead_top, chin, measure], [cheek_l, cheek_r, measure]]
  - id: M005
    key: forehead_cheek
    name_zh: 额宽 / 颧宽
    group: overall
    pillar: architecture
    view: front
    unit: ratio
    decimals: 2
    tier: free
    class: A
    compute: forehead_cheek
    pose: medium
    max_confidence: high
    valid_range: [0.4, 1.4]
    definition_zh: 太阳穴高度的额部宽度 ÷ 颧骨处脸宽。
    overlay:
      segments: [[forehead_l, forehead_r, measure], [cheek_l, cheek_r, reference]]
      outline: true
  - id: M006
    key: jaw_cheek
    name_zh: 下颌宽 / 颧宽
    group: overall
    pillar: architecture
    view: front
    unit: ratio
    decimals: 2
    tier: free
    class: A
    aliases: [M007]
    compute: jaw_cheek
    pose: medium
    max_confidence: high
    valid_range: [0.4, 1.4]
    definition_zh: 两侧下颌转角处的宽度 ÷ 颧骨处脸宽。
    overlay:
      segments: [[jaw_l, jaw_r, measure], [cheek_l, cheek_r, reference]]
      outline: true
  - id: M012
    key: outline_fill
    name_zh: 轮廓饱满度
    group: overall
    pillar: architecture
    view: front
    unit: fraction
    decimals: 0
    tier: full
    class: A
    compute: outline_fill
    pose: medium
    max_confidence: medium
    valid_range: [0.6, 0.95]
    definition_zh: 脸部外轮廓（正面投影）面积 ÷ 它的外接矩形面积。越高，轮廓越接近方圆；越低，越接近椭圆或倒三角。
    overlay:
      segments: [[bbox_tl, bbox_tr, reference], [bbox_tr, bbox_br, reference], [bbox_br, bbox_bl, reference], [bbox_bl, bbox_tl, reference]]
      outline: true

  # --- 三庭五眼 · 比例与和谐 -----------------------------------------------------------------------------
  - id: M017
    key: upper_third
    name_zh: 上庭占比
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: free
    class: B
    compute: upper_third
    needs: [hairline]
    pose: medium
    max_confidence: medium
    valid_range: [0.15, 0.5]
    definition_zh: 发际线到眉间 ÷ 发际线到下巴（纵向）。发际线来自头发分割，被刘海遮住时不测量。
    overlay:
      segments: [[th_hair_l, th_hair_r, measure], [th_glab_l, th_glab_r, measure], [th_sub_l, th_sub_r, reference], [th_chin_l, th_chin_r, reference]]
  - id: M018
    key: middle_third
    name_zh: 中庭占比
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: free
    class: A
    compute: middle_third
    needs: [hairline]
    pose: medium
    max_confidence: high
    valid_range: [0.2, 0.5]
    definition_zh: 眉间到鼻底 ÷ 发际线到下巴（纵向）。没有发际线时不测量，改看“中庭 / 下庭”。
    overlay:
      segments: [[th_hair_l, th_hair_r, reference], [th_glab_l, th_glab_r, measure], [th_sub_l, th_sub_r, measure], [th_chin_l, th_chin_r, reference]]
  - id: M019
    key: lower_third
    name_zh: 下庭占比
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: free
    class: A
    compute: lower_third
    needs: [hairline]
    pose: medium
    max_confidence: high
    valid_range: [0.2, 0.5]
    definition_zh: 鼻底到下巴 ÷ 发际线到下巴（纵向）。
    overlay:
      segments: [[th_hair_l, th_hair_r, reference], [th_glab_l, th_glab_r, reference], [th_sub_l, th_sub_r, measure], [th_chin_l, th_chin_r, measure]]
  - id: M025
    key: middle_lower
    name_zh: 中庭 / 下庭
    group: proportions
    pillar: harmony
    view: front
    unit: ratio
    decimals: 2
    tier: free
    class: A
    compute: middle_lower
    pose: medium
    max_confidence: high
    valid_range: [0.55, 1.8]
    definition_zh: 眉间到鼻底 ÷ 鼻底到下巴（纵向）。不需要发际线，刘海遮挡时也能测。
    overlay:
      segments: [[th_glab_l, th_glab_r, measure], [th_sub_l, th_sub_r, measure], [th_chin_l, th_chin_r, measure]]
  - id: M024
    key: upper_middle
    name_zh: 上庭 / 中庭
    group: proportions
    pillar: harmony
    view: front
    unit: ratio
    decimals: 2
    tier: full
    class: B
    compute: upper_middle
    needs: [hairline]
    pose: medium
    max_confidence: medium
    valid_range: [0.5, 1.8]
    definition_zh: 发际线到眉间 ÷ 眉间到鼻底（纵向）。
    overlay:
      segments: [[th_hair_l, th_hair_r, measure], [th_glab_l, th_glab_r, measure], [th_sub_l, th_sub_r, measure]]
  - id: M083
    key: philtrum_lower
    name_zh: 人中 / 下庭
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: full
    class: A
    compute: philtrum_lower
    pose: medium
    max_confidence: high
    valid_range: [0.12, 0.45]
    definition_zh: 鼻底到上唇缘中点 ÷ 鼻底到下巴（纵向）。
    overlay:
      segments: [[subnasale, lip_top, measure], [subnasale, chin, reference]]
      points: [subnasale, lip_top, chin]
  - id: M021
    key: chin_lower
    name_zh: 下巴高度 / 下庭
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: full
    class: A
    aliases: [M089, M102]
    compute: chin_lower
    pose: medium
    max_confidence: high
    valid_range: [0.25, 0.75]
    definition_zh: 下唇下缘到下巴底 ÷ 鼻底到下巴底（纵向）。
    overlay:
      segments: [[lip_bottom, chin, measure], [subnasale, chin, reference]]
      points: [subnasale, lip_bottom, chin]
  - id: M030
    key: fifths_spread
    name_zh: 五眼均匀度
    group: proportions
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: full
    class: A
    compute: fifths_spread
    pose: high
    max_confidence: high
    valid_range: [0.0, 0.8]
    definition_zh: 眼睛高度处五段宽度的离散程度（变异系数）。数值越小五段越接近；不以相等为目标。
    overlay:
      segments: [[f0_t, f0_b, measure], [f1_t, f1_b, measure], [f2_t, f2_b, measure], [f3_t, f3_b, measure], [f4_t, f4_b, measure], [f5_t, f5_b, measure], [f0_m, f5_m, reference]]

  # --- 眼 ------------------------------------------------------------------------------------------------
  - id: M033
    key: intercanthal_eye
    name_zh: 眼距 / 眼宽
    group: eyes
    pillar: harmony
    view: front
    unit: ratio
    decimals: 2
    tier: free
    eyewear: true
    class: A
    aliases: [M029]
    compute: intercanthal_eye
    pose: medium
    max_confidence: high
    valid_range: [0.5, 1.8]
    definition_zh: 两内眼角间距 ÷ 双眼平均眼宽。1.00 表示两眼之间正好“一只眼”的宽度。
    overlay:
      segments: [[eye_l_inner, eye_r_inner, measure], [eye_l_outer, eye_l_inner, reference], [eye_r_inner, eye_r_outer, reference]]
  - id: M034
    key: intercanthal_face
    name_zh: 眼距 / 颧宽
    group: eyes
    pillar: harmony
    view: front
    unit: ratio
    decimals: 2
    tier: full
    eyewear: true
    class: A
    compute: intercanthal_face
    pose: medium
    max_confidence: high
    valid_range: [0.15, 0.45]
    definition_zh: 两内眼角间距 ÷ 颧骨处脸宽。
    overlay:
      segments: [[eye_l_inner, eye_r_inner, measure], [cheek_l, cheek_r, reference]]
  - id: M035
    key: interpupil_face
    name_zh: 瞳距 / 颧宽
    group: eyes
    pillar: harmony
    view: front
    unit: ratio
    decimals: 2
    tier: full
    eyewear: true
    class: A
    compute: interpupil_face
    needs: [iris]
    pose: medium
    max_confidence: high
    valid_range: [0.3, 0.7]
    definition_zh: 两虹膜中心间距 ÷ 颧骨处脸宽。受视线方向影响，平视镜头时最准。
    overlay:
      segments: [[iris_l, iris_r, measure], [cheek_l, cheek_r, reference]]
      points: [iris_l, iris_r]
  - id: M037
    key: eye_width_iris
    name_zh: 眼宽 / 虹膜直径
    group: eyes
    pillar: expression
    view: front
    unit: ratio
    decimals: 2
    tier: full
    eyewear: true
    class: A
    aliases: [M038]
    compute: eye_width_iris
    needs: [iris]
    pose: low
    max_confidence: high
    valid_range: [1.5, 4.0]
    definition_zh: 眼宽相当于几个虹膜直径（两眼平均，另列左右）。虹膜直径在成人之间差异较小，适合作相对尺子。
    overlay:
      segments: [[eye_l_outer, eye_l_inner, measure], [eye_r_inner, eye_r_outer, measure], [iris_l_a, iris_l_b, reference], [iris_r_a, iris_r_b, reference]]
  - id: M041
    key: eye_aspect
    name_zh: 眼睛纵横比
    group: eyes
    pillar: expression
    view: front
    unit: ratio
    decimals: 2
    tier: free
    eyewear: true
    class: A
    aliases: [M039, M040]
    compute: eye_aspect
    needs: [eyes_open]
    pose: low
    max_confidence: high
    valid_range: [0.12, 0.6]
    definition_zh: 上下眼睑中点距离 ÷ 眼宽（两眼平均，另列左右）。越大眼型越圆，越小越细长；受表情和笑容影响。
    overlay:
      segments: [[eye_l_top, eye_l_bottom, measure], [eye_r_top, eye_r_bottom, measure], [eye_l_outer, eye_l_inner, reference], [eye_r_inner, eye_r_outer, reference]]
  - id: M044
    key: canthal_tilt
    name_zh: 外眼角倾斜
    group: eyes
    pillar: expression
    view: front
    unit: deg
    decimals: 0
    tier: free
    eyewear: true
    class: A
    aliases: [M042, M043]
    compute: canthal_tilt
    pose: low
    max_confidence: high
    valid_range: [-20, 25]
    definition_zh: 内眼角到外眼角的连线与水平线的夹角（已扣除头部倾斜，两眼平均）。正值 = 外眼角更高。
    overlay:
      segments: [[eye_l_inner, eye_l_outer, measure], [eye_r_inner, eye_r_outer, measure]]
      angles: [[eye_l_outer, eye_l_inner, eye_l_hz], [eye_r_outer, eye_r_inner, eye_r_hz]]

  # --- 眉 (网格估计，未做毛发分割 → 最高中等置信度) ----------------------------------------------------------
  - id: M051
    key: brow_length_face
    name_zh: 眉长 / 颧宽
    group: brows
    pillar: expression
    view: front
    unit: ratio
    decimals: 2
    tier: full
    eyewear: true
    class: B
    compute: brow_length_face
    pose: medium
    max_confidence: medium
    valid_range: [0.2, 0.6]
    definition_zh: 眉头到眉尾的长度 ÷ 颧骨处脸宽（两眉平均）。眉形按面部网格估计，修过或画过的眉尾会有偏差。
    overlay:
      segments: [[brow_l_head, brow_l_tail, measure], [brow_r_head, brow_r_tail, measure], [cheek_l, cheek_r, reference]]
  - id: M054
    key: brow_tilt
    name_zh: 眉毛倾斜
    group: brows
    pillar: expression
    view: front
    unit: deg
    decimals: 0
    tier: free
    eyewear: true
    class: B
    aliases: [M052, M053]
    compute: brow_tilt
    pose: low
    max_confidence: medium
    valid_range: [-25, 30]
    definition_zh: 眉头到眉尾连线与水平线的夹角（已扣除头部倾斜，两眉平均）。正值 = 眉尾更高（上扬），负值 = 眉尾下垂。
    overlay:
      segments: [[brow_l_head, brow_l_tail, measure], [brow_r_head, brow_r_tail, measure]]
      angles: [[brow_l_tail, brow_l_head, brow_l_hz], [brow_r_tail, brow_r_head, brow_r_hz]]
  - id: M055
    key: brow_eye_gap
    name_zh: 眉眼距离
    group: brows
    pillar: expression
    view: front
    unit: ratio
    decimals: 2
    tier: free
    eyewear: true
    class: B
    compute: brow_eye_gap
    pose: medium
    max_confidence: medium
    valid_range: [0.1, 1.2]
    definition_zh: 眉毛下缘到上眼睑的纵向距离 ÷ 眼宽（两侧平均）。越小眉眼越近、轮廓越深；越大越舒展。
    overlay:
      segments: [[brow_l_low, eye_l_top, measure], [brow_r_low, eye_r_top, measure]]
      points: [brow_l_low, eye_l_top, brow_r_low, eye_r_top]
  - id: M056
    key: brow_head_gap
    name_zh: 眉头间距 / 眼距
    group: brows
    pillar: expression
    view: front
    unit: ratio
    decimals: 2
    tier: full
    eyewear: true
    class: B
    compute: brow_head_gap
    pose: medium
    max_confidence: medium
    valid_range: [0.6, 2.0]
    definition_zh: 两眉头之间的距离 ÷ 两内眼角间距。
    overlay:
      segments: [[brow_l_head, brow_r_head, measure], [eye_l_inner, eye_r_inner, reference]]
  - id: M057
    key: brow_peak_position
    name_zh: 眉峰位置
    group: brows
    pillar: expression
    view: front
    unit: fraction
    decimals: 0
    tier: full
    eyewear: true
