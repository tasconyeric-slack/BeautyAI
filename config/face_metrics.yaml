    pose: low
    max_confidence: high
    valid_range: [0.1, 0.6]
    definition_zh: 上下红唇中央高度之和 ÷ 嘴宽。越大唇部越饱满。
    overlay:
      segments: [[lip_top, lip_upper_inner, measure], [lip_lower_inner, lip_bottom, measure], [mouth_l, mouth_r, reference]]
  - id: M081
    key: cupid_bow
