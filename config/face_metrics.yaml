    needs: [color]
    pose: low
    max_confidence: medium
    valid_range: [-20, 50]
    definition_zh: 两颊肤色取样的 Lab b*（越大越偏黄、越暖）。冷暖结论另由色彩页综合判断。
    overlay:
      points: [cheek_sample_l, cheek_sample_r]
  - id: M141
    key: cheek_color_diff
    name_zh: 左右颊色差
    group: skin
    pillar: skin
    view: front
    unit: delta_e
    decimals: 1
    tier: full
