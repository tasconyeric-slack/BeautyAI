    valid_range: [0, 40]
    definition_zh: 左右两颊取样颜色的 ΔE（CIE76）。通常反映侧光或阴影，而不是皮肤本身。
    overlay:
      points: [cheek_sample_l, cheek_sample_r]
      segments: [[cheek_sample_l, cheek_sample_r, reference]]
  - id: M148
    key: light_balance
    name_zh: 左右光线差
    group: skin
    pillar: skin
    view: front
    unit: lab_l
    decimals: 1
    tier: free
    class: A
    compute: light_balance
    needs: [color]
    pose: low
    max_confidence: high
    valid_range: [0, 60]
    definition_zh: 左右两颊明度 L* 之差。差值大说明一侧受光更多，会影响肤色、轮廓和对称的判断。
    overlay:
      points: [cheek_sample_l, cheek_sample_r]
      segments: [[cheek_sample_l, cheek_sample_r, measure]]
  - id: M013
