    max_confidence: high
    valid_range: [0.25, 0.6]
    definition_zh: 两侧嘴角距离 ÷ 颧骨处脸宽。放松、不笑时最准。
    overlay:
      segments: [[mouth_l, mouth_r, measure], [cheek_l, cheek_r, reference]]
  - id: M080
    key: lip_ratio
