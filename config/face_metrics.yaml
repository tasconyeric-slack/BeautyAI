    overlay:
      segments: [[chin_l, chin_r, measure], [jaw_l, jaw_r, reference]]
      outline: true

  # --- 左右对称 · 比例与和谐 -----------------------------------------------------------------------------
  - id: M114
    key: landmark_symmetry
