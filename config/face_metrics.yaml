    view: front
    unit: fraction
    decimals: 0
    tier: full
    eyewear: true
    class: A
    compute: outer_canthus_height
    pose: medium
    max_confidence: high
    valid_range: [0, 0.5]
    definition_zh: 两外眼角的纵向高度差 ÷ 平均眼宽（已扣除头部倾斜）。
    overlay:
      segments: [[eye_l_outer, eye_r_outer, measure], [eye_l_outer, roll_hz, reference]]
  - id: M107
    key: brow_height_asym
    name_zh: 两眉高度差
    group: symmetry
    pillar: harmony
    view: front
    unit: fraction
    decimals: 0
    tier: full
    eyewear: true
    class: B
    compute: brow_height_asym
    pose: medium
    max_confidence: medium
    valid_range: [0, 0.8]
    definition_zh: 两侧眉眼距离之差 ÷ 平均眉眼距离。挑眉等表情会放大它。
    overlay:
      segments: [[brow_l_low, eye_l_top, measure], [brow_r_low, eye_r_top, measure]]
  - id: M110
    key: nose_tip_offset
    name_zh: 鼻尖偏离中轴
