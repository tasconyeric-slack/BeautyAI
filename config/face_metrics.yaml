     definition_zh: 两眼中心连线到口裂中点的纵向距离 ÷ 额顶标志点到下巴。,
     overlay: {segments: [[eye_mid, stomion, measure], [forehead_top, chin, reference], [eye_l_center, eye_r_center, reference]]}}
  - {id: M027, key: outer_fifths_diff, name_zh: 左右外侧五等分差, group: proportions, pillar: harmony, view: front, unit: fraction, decimals: 0, tier: full, class: A, compute: outer_fifths_diff, pose: high, max_confidence: medium, valid_range: [0, 0.8],
     definition_zh: 最左与最右两段五等分（太阳穴到外眼角）宽度之差 ÷ 平均段宽。转头会放大这一项。,
     overlay: {segments: [[f0_m, f1_m, measure], [f4_m, f5_m, measure], [f1_m, f4_m, reference]]}}
  - {id: M028, key: eye_fifth, name_zh: 眼宽 / 五等分均宽, group: proportions, pillar: harmony, view: front, unit: ratio, decimals: 2, tier: full, class: A, compute: eye_fifth, pose: medium, max_confidence: medium, valid_range: [0.6, 1.4],
     definition_zh: 平均眼裂宽度 ÷ 五等分（太阳穴到太阳穴）的平均段宽。1 表示眼宽正好是一“眼”。,
