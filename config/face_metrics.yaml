    definition_zh: 两颊肤色取样的 CIE Lab 明度 L*（0–100）。手机白平衡未校准，只是本张照片的相对观察。
    overlay:
      points: [cheek_sample_l, cheek_sample_r]
  - id: M139
    key: skin_warmth
    name_zh: 肤色黄蓝倾向
