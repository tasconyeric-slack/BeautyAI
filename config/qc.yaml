# Photo QC + anchor measurement config v0.4 (src/aesthetic_passport/qc.py, anchors.py)
# Forgiving gate: most problems are a `warn` (photo still analysed, warning passed to the model);
# only clearly unusable photos are a `reject`. Thresholds are starting values — tune on real phone photos.

photo_roles:                      # D20 (amends D14): only the front photo is required
  required: [front]
  optional: [profile90, noglasses, profile45, smile, hair]   # V3B (D35): profile90 = true side, noglasses = glasses-free front
  face_optional: [hair]           # the hair photo may show the back of the head: no face checks

gate:
  # Separate framing from native resolution (#55). face_too_small means low relative occupancy only;
  # insufficient visible face pixels use the existing blurry/detail code with resolution-specific guidance.
  # Intersect landmark bounds with the image: off-image pixels never count. No upper framing limit.
  face_rel_min: 0.16              # max(face height / image height, face width / image width) below this → warn
  face_rel_reject: 0.06           # … below this → reject
  min_face_box_px: 120            # shorter visible side (px, on the ≤1600 px working image) — below: detail warning
  min_face_box_px_reject: 80      # below: reject
  multi_face_min_rel_area: 0.35   # a second face counts only if its box is ≥ 35% of the largest face's area
  # Sharpness (D28): measured on eyes, brows and lips (never cheeks: smooth skin has no detail to lose), on the face
  # scaled DOWN to ≤ sharp_eval_face_px wide (never up: upsampling a small sharp face made it look blurry).
  # edge_width = local contrast / strongest gradient (px; a crisp edge is ~2–4 px; σ blur adds ~2.5σ). Horizontal
  # features hide horizontal motion blur, so the x-direction width counts too, divided by sharp_x_factor.
  # detail_px = evaluated face width × 1.6 / edge_width (a sharp-equivalent face width; reported as blur_score).
  # Calibrated 2026-10-23 on public-domain portraits: ID crops 358×441 / 413×531, JPEG q60, bilateral smoothing all
  # ≤ 5.1 px; Gaussian σ3 on an ID crop ≥ 6.8 px; 4× upsampled faces ≥ 5.4 px; motion blur ≥ 6 px.
  sharp_eval_face_px: 256
  sharp_x_factor: 2.2
  edge_width_warn: 5.3            # above → blurry (warn)
  edge_width_reject: 8.5          # above → blurry (reject)
  detail_px_warn: 60              # blurry (warn) when detail_px is below this AND edge_width > detail_min_edge_width
  detail_px_reject: 30            # blurry (reject) when detail_px is below this AND edge_width > detail_min_edge_width
  detail_min_edge_width: 4.0      # softness condition; native resolution is checked separately even for crisp edges
  blur_laplacian_var_min: 80      # face-optional photos only (back of the head): Laplacian on the frame scaled to ≤512 px
  face_luma_min: 70               # mean luminance (0-255) inside the face oval — below: warn
  face_luma_reject_min: 40
  face_luma_max: 200              # above: warn
  face_luma_reject_max: 230
  clipped_highlight_max_frac: 0.05   # fraction of face pixels with any channel ≥ 250 — above: warn
  clipped_highlight_reject_frac: 0.20
  pose:                           # degrees, from the FaceLandmarker facial transformation matrix
    front:     {yaw_max: 12, pitch_max: 20, roll_max: 10}
    smile:     {yaw_max: 15, pitch_max: 20, roll_max: 12}
    noglasses: {yaw_max: 12, pitch_max: 20, roll_max: 10}
    profile45: {yaw_min: 30, yaw_max: 55, pitch_max: 20, roll_max: 15}   # compared against |yaw|: either side
  pose_reject_factor: 2.2         # beyond limit × factor → reject (front/smile pose_off_axis)
  profile45_reject_below_yaw: 12  # a "profile" this close to frontal is the wrong photo → reject
  # passed = front != reject (D20). A failed gate stops the run before any model call.
  # Beauty-filter suspicion (warn only): median gradient inside both cheek discs, same down-only scale as sharpness.
  # Naturally smooth skin and strong smoothing overlap (calibration: natural 1.6–4.0, bilateral filter 1.1–2.0), so the
  # limit is conservative: it flags only near-textureless skin. Tune on real filtered phone photos (I1).
  beauty_filter_roles: [front]
  beauty_filter_cheek_texture_min: 1.2
  # Glasses hint (V3B, warn only, uncalibrated): share of selfie-segmenter "others / accessories" pixels in the
  # eye + brow band. The person's own answer at upload ("这张照片戴了眼镜") is the primary signal.
  eyewear_roles: [front, noglasses]
  eyewear_others_frac: 0.08
  # True side profile (V3B, D35). MediaPipe's yaw reads only ~40° on a real 90° profile, so the angle test is
  # geometric: in a true profile the nose tip is ON the head outline; in a 45° photo the far cheek lies beyond it.
  profile90:
    frontal_yaw_below: 25         # MediaPipe |yaw| below this → clearly a front / three-quarter photo → reject
    max_nose_gap: 0.05            # MediaPipe nose tip → traced outline ÷ (nasion→chin) above this → three-quarter → reject
    face_h_px_reject: 160         # face-skin height in native pixels below this → face_too_small (reject: unmeasurable)
    face_h_px_warn: 320           # … below this → face_too_small (warn: small features get "resolution too low")
  # occluded_eyes: not a gate in v1 (blendshapes are unreliable for sunglasses / hair occlusion).

lighting_consistency:
  # Per usable (non-rejected) photo, take the mean a* and mean b* of the face crop (OpenCV Lab, 0-255 scale).
  # spread = max(range(mean_a*), range(mean_b*)) across usable photos; range = max - min.
  # This is only a RELATIVE consistency check between the user's photos, never an absolute skin-color read.
  # It only lowers color confidence downstream; it never rejects a photo or the run.
  high_if_spread_below: 6
  medium_if_spread_below: 12
  # else low

anchors:
  # MediaPipe FaceLandmarker (478 pts) indices. Verified 2026-10-22 with scripts/debug_landmarks.py on two
  # frontal test portraits: every point below sits where its name says. forehead_* = 54/284, the lateral
  # forehead edge at temple level (the widest forehead line). 103/332 (used by haircut-vision-advisor) sit
  # higher, near the hairline, and are often under hair — they are kept only for the face-shape heuristic,
  # whose thresholds were calibrated on them (heuristic_forehead below).
  # Normalized landmark coords are converted to pixels (x*width, y*height) before any distance.
  # If any ratio falls outside the passport schema range, anchors = null and a warning is logged.
  # Measurements are never clamped.
  landmarks:
    forehead_top: 10
    chin: 152
    cheek_left: 234
    cheek_right: 454
    jaw_left: 172
    jaw_right: 397
    forehead_left: 54
    forehead_right: 284
    glabella: 9
    subnasale: 2
    left_eye_outer: 33
    left_eye_inner: 133
    right_eye_inner: 362
    right_eye_outer: 263
  heuristic_forehead: {left: 103, right: 332}
  reliability:
    high_if_front_yaw_below: 6
    medium_if_front_yaw_below: 12

