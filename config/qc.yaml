  multiple_faces: "画面里有多张人脸，请单人拍摄。"
  face_too_small: "脸部在画面中占比偏小。可裁掉多余背景并保留完整五官；重新拍摄时请靠近一些。"
  blurry: "照片有些模糊，请擦干净镜头、保持手稳后重拍。"
  underexposed: "光线偏暗，请面向窗户在白天自然光下拍摄。"
  overexposed: "脸部过曝，请避开直射阳光或强闪光。"
  pose_off_axis: "头部有明显倾斜或转动，请平视镜头、下巴放平。"
  wrong_angle_for_role: "侧脸照需要约 45° 转头，请露出一侧颧骨和下颌线。"
  occluded_eyes: "眼睛被遮挡，请摘下墨镜、撩开遮眼的头发。"
  lighting_inconsistent: "几张照片的光线差别较大，色彩判断会更保守。可以的话在同一处光线下重拍。"
  beauty_filter_suspect: "照片可能开了美颜或滤镜，肤色与质感会不准。可以的话关掉美颜重拍。"
  eyewear_detected: "可能戴着眼镜：可以正常分析，眼部和眉部的个别项目会标注影响；补充一张无眼镜正脸照会更准。"
  profile_unclear: "侧面轮廓不清晰：请在明亮的纯色背景前拍，撩开挡住额头、鼻子或下巴的头发，手不要挡脸。"

# Role-specific wording (falls back to retake_messages_zh).
retake_messages_role_zh:
  profile90:
    wrong_angle_for_role: "这张更像 45° 半侧面。侧脸照需要接近 90°：只露出一侧脸，鼻尖在脸的轮廓线上，看不到另一侧脸颊。"
    face_too_small: "侧脸在照片里像素太少，鼻唇角等细节误差会过大。请上传原图，或靠近一些拍，让头部占画面高度一半左右。"
    no_face: "没有找到侧脸轮廓，请在明亮的纯色背景前拍一张 90° 侧脸。"
  noglasses:
    eyewear_detected: "这张照片里似乎仍有眼镜，请摘下眼镜再拍。"

# Contextual wording for the existing blurry/detail code; these are not public issue codes.
retake_messages_context_zh:
  low_face_resolution: "脸部实际像素不足，分辨率或有效细节不够。请上传更高分辨率的清晰原图，避免截图、压缩或放大小图。"

color_sampling:
  # Regional median colors on the front photo (src/aesthetic_passport/color_sample.py, D15). A signal, not a verdict.
  cheek_radius_frac: 0.11        # cheek disc radius as a fraction of cheekbone width
  cheek_outward_frac: 0.06       # shift the disc centre outward from the eye–mouth midpoint (× cheekbone width)
  skin_L_keep: [20, 80]          # keep pixels between these L percentiles (drops shadows and specular highlights)
  hair_L_keep: [10, 90]
  brow_darkest_frac: 0.3         # brows: darkest 30% of the brow hull (brow hair, not the skin between hairs)
  iris_radius_keep: [0.45, 0.85] # annulus inside the iris circle: skip the pupil and the limbal edge
  min_pixels: {skin: 300, brow: 40, iris: 20, lip: 80, hair: 300}
  reliability:
    face_luma_ok: [80, 190]      # outside → at most medium
    clipped_frac_medium: 0.03    # above → at most medium
    clipped_frac_low: 0.10       # above → low

preview_masks:
  # Recommended Look masks (src/aesthetic_passport/masks.py). Fractions of the cheekbone width unless noted.
  protect_above_brow_frac: 0.02  # protected face region starts this far above the brow line (forehead stays editable)
  feature_pad_frac: 0.03         # padding around eyes / nose / mouth / brows hulls
  hair_dilate_frac: 0.12         # brief table: 25–40 px on a typical 300 px-wide face
  hair_room_w: 0.80              # half-ellipse above the brows for added volume: half-width × face width
  hair_room_h: 0.95              #   height × face width
  hair_room_below: 0.55          # band beside the face down to ~ear level (× face width)
  brows_dilate_frac: 0.02
  glasses_dilate_frac: 0.04
  facial_hair_dilate_frac: 0.03
  clothing_below_chin_frac: 0.25
  clothing_dilate_frac: 0.03
  crop_half_width: 1.25          # crop sent to the model: ± this × face width around the face centre
  crop_above: 0.90               # × face height above the face box
  crop_below: 0.55
  crop_below_clothing: 1.60
  feather_px: 11                 # brief: 8–15 px
  # V2 soft protection (D22): the core (eyes, nose, mouth hulls dilated by core_pad_px) is always the original;
  # the edge zone (cheek outline, temples, jaw outline = the rest of the old protected region) may be covered only
  # by pixels the result itself segments as hair, so long hair and fringes are not cut off.
  core_pad_px: 6
  soft_protection: true
  composite_mode: feather        # feather | seamless (cv2.seamlessClone; off by default, D22)
  color_transfer: true           # Lab mean/std transfer of the edited crop onto the original over the boundary band
  color_band_px: 18
  # Quality gate: core pixels unchanged (by construction) and enough change inside the edit region; otherwise one
  # regeneration, then status `fallback` (the UI shows the style illustration instead).
  min_hair_change: 3.0           # mean |Δ| (0–255) over the edit mask; catches "nothing changed". Tune in I1 on real photos
  max_attempts: 2
  concurrency: 3
  # Issue #56: image-edit models can move, zoom or tilt the head. The generated face's rigid landmarks register it
  # back onto the original before compositing; anything not a small rigid move is rejected (retry, then fallback).
  # Fractions are × cheekbone width. Landmark jitter on an unmoved edit measured ≈ 0.01. Provisional: confirm on
  # consented real photos with live Qwen output.
  registration:
    min_shift_frac: 0.015           # smaller offsets (landmark jitter, inside the 6 px feature pad) are not resampled
    max_shift_frac: 0.25            # larger head moves are reframings: reject
    max_scale_dev: 0.12             # |scale − 1|
    max_rotation_deg: 8
    max_residual_frac: 0.03         # largest landmark error after alignment: above it the face was reshaped
    min_face_area_frac: 0.25        # a detected face smaller than this × the original face box is ignored
    max_composite_drift_frac: 0.03  # final composite: mean offset of any eye/brow/nose/mouth group vs the original

preview_label:
  text: "AI 试看"
  ascii_fallback: "AI PREVIEW"   # when no CJK font is installed
  font_candidates:
    - /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
    - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    - /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
  height_frac: 0.045             # label text height × image height
  producer: "形象护照 Aesthetic Passport"
