# 八型是视觉方向，不描述身份或性格；表达方向由用户选择。
# 用法：rules_zh 与 by_presentation[选择].rules_zh 合并，后者覆盖同名字段。
# 示例只说明搭配关系；实际配色取个人色卡，发型按现有长度与打理条件调整。
# 过渡依据 rules.yaml 原型平面的邻近关系，每次先替换一件现有单品。
version: 1
styles:
  sweet:
    name_zh: 少女型
    summary_zh: 小尺度的圆润线条与轻巧细节，形成轻盈、柔和的视觉印象。
    keywords_zh: [轻巧, 圆润, 细节小巧]
    rules_zh:
      fabric: 选细针织、棉府绸或薄呢，让面料表面细密；轻薄面料搭一层不透的内搭。
      silhouette: 用短外搭配简洁下装，圆弧下摆或轻微展开的裙摆只选一处。
      pattern: 选小圆点、细格或小花，每套先留一件图案单品，其余用素面衔接。
      accessories: 配圆形小耳饰、细链或小号圆角包，装饰集中在一处。
      neckline: 从小圆领、圆角衬衫领或窄圆弧领口开始，领边保持简洁。
      hair_hint: 保留柔和发尾，可用圆梳把末端带出小弧度；刘海与卷度按现有长度选择。
      makeup_hint: 如使用彩妆，从个人色卡选柔和唇色，薄涂并晕开边缘，腮红少量分次叠加。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 圆领短开衫配轻微展开的半裙，裙摆与袖口不同时堆叠褶边。
          accessories: 用一对小圆耳钉或一根细链，圆角小包与领口呼应。
          hair_hint: 下巴到肩部长度可把发尾向内吹一圈，长发可用细发绳扎低马尾。
          makeup_hint: 可选色卡内柔和唇色薄涂，腮红在面颊中部少量晕开，不叠加亮片。
        examples_zh:
          - 圆领细针织开衫 + 小褶半裙 + 圆头平底鞋
          - 圆角领棉衬衫 + 直筒九分裤 + 小号圆角包
          - 小圆点连衣裙 + 素面短外套 + 细带平底鞋
        avoid_zh:
          - 若想保持轻巧，同套先不叠加大蝴蝶结、密集蕾丝与多层褶边，留一种细节即可。
      masculine:
        rules_zh:
          silhouette: 合肩圆领针织衫配直筒裤，短夹克下摆落在裤腰附近，留出清楚层次。
          accessories: 选窄表带与小号帆布包，金属扣件用圆角造型。
          hair_hint: 短发沿原有分线吹顺，额前保留轻弧；中长发可把耳侧发丝别好。
          makeup_hint: 如想加理容细节，可把眉毛顺着生长方向梳齐，唇部选透明或低浓度润色。
        examples_zh:
          - 细条纹圆领针织衫 + 直筒棉裤 + 素面帆布鞋
          - 圆角领衬衫 + 短款针织背心 + 九分裤
          - 小格纹短夹克 + 素面内搭 + 简洁系带鞋
        avoid_zh:
          - 若想保留柔和感，厚重金属链与大面积硬挺拼接不同时使用，可换成圆角小扣件。
      neutral:
        rules_zh:
          silhouette: 圆领直身上衣配九分直筒裤，圆角口袋或弧形下摆选一个作为细节。
          accessories: 选小号圆角斜挎包或圆形别针，让其余五金保持素面。
          hair_hint: 按原发长吹出自然圆弧，短发用手指理顺，长发可松扎在颈后。
          makeup_hint: 可只用透明眉胶梳齐毛流；想加颜色时，在唇部薄涂一种色卡内柔和色。
        examples_zh:
          - 圆领棉卫衣 + 九分直筒裤 + 圆角帆布斜挎包
          - 小格衬衫 + 细针织背心 + 素面布鞋
          - 弧形下摆衬衫 + 直身长裤 + 小圆别针
        avoid_zh:
          - 若想突出小尺度细节，大包、大吊坠与宽腰带先选一件，其余换成细小款。
    transitions_to:
      elegant:
        keep_zh: [保留圆弧领口与细小配饰。]
        add_zh: [把小褶裙换成垂感直身裙，再把小图案换成素面。]
      classic:
        keep_zh: [保留细密面料与简洁的短外搭。]
        add_zh: [把圆角领换成小翻领，加入一条中线清楚的直筒裤。]

  boyish:
    name_zh: 少年型
    summary_zh: 小尺度的直线剪裁与清晰分段，呈现轻快、利落的视觉节奏。
    keywords_zh: [轻快, 直线, 清晰分段]
    rules_zh:
      fabric: 选棉斜纹、细帆布或薄牛仔，让衣片有支撑又便于活动。
      silhouette: 用合肩短外套与直筒下装，衣摆和裤脚保持整齐，减少拖叠。
      pattern: 选细条纹、小方格或一处简洁色块，图案边界保持清楚。
      accessories: 选小方包、窄表带或小号方形扣件，与直线剪裁呼应。
      neckline: 选衬衫领、小翻领或窄罗纹圆领，领角与领边保持平整。
      hair_hint: 沿现有分线吹出清楚走向，两侧整理贴顺，发尾不要同时堆出多组卷度。
      makeup_hint: 如使用彩妆，可用清楚的眉毛走向与薄涂唇色，面部只保留一个颜色重点。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 短款直线夹克配直筒裤或直身短裙，下摆保持平整，露出明确的上下分段。
          accessories: 小方形耳钉与窄皮带选一种，再配简洁方包。
          hair_hint: 短发把耳侧梳顺，肩部长度可将发尾吹直，想换分线可先用发夹固定试看。
          makeup_hint: 可顺着原眉形补少量眉尾，唇色薄涂成清楚边缘，腮红保留淡淡一层。
        examples_zh:
          - 短款牛仔夹克 + 直身半裙 + 系带平底鞋
          - 细条纹衬衫 + 直筒九分裤 + 小方形斜挎包
          - 短款针织背心 + 素面衬衫 + 直线剪裁短裤
        avoid_zh:
          - 若想保持清晰分段，长上衣与拖地裤先不要一起叠穿，可把上衣下摆整理到裤腰处。
      masculine:
        rules_zh:
          silhouette: 合肩短夹克配直筒棉裤，裤脚到鞋面附近，不堆出多层褶皱。
          accessories: 选窄表带、小号邮差包或简洁棒球帽，每套用一至两种。
          hair_hint: 短发把顶部吹向一侧，两侧顺着发流整理；保留少量发束间隙。
          makeup_hint: 如有理容习惯，可把眉毛梳齐，并将已有胡须边缘整理清楚，唇部选透明质地。
        examples_zh:
          - 短款棉夹克 + 圆领上衣 + 直筒斜纹裤
          - 小格纹衬衫 + 素面针织背心 + 帆布鞋
          - 短袖翻领上衣 + 九分棉裤 + 小号邮差包
        avoid_zh:
          - 若想保留轻快节奏，厚底靴与大号多袋长外套先选一件，另一件换成轻便款。
      neutral:
        rules_zh:
          silhouette: 方形衬衫外搭配直筒裤，袖口卷一折，衣摆不盖住全部口袋。
          accessories: 用小方包或窄织带腰带强调一条直线，其余配件保持素面。
          hair_hint: 依原发长梳出偏分，长发扎成低马尾并将两侧别顺，短发用少量造型品定走向。
          makeup_hint: 可只用透明眉胶固定毛流；想加唇色时选低浓度色卡色，沿原唇线薄涂。
        examples_zh:
          - 方形口袋衬衫 + 直筒九分裤 + 简洁布鞋
          - 短款工装外套 + 细条纹内搭 + 小方包
          - 窄罗纹圆领上衣 + 直线短裤 + 中筒素色袜
        avoid_zh:
          - 若想突出直线感，荷叶边与层层垂坠配饰不同时加入，可先保留一条干净领边。
    transitions_to:
      modern:
        keep_zh: [保留短外套、清楚领角与直筒下装。]
        add_zh: [把素面包换成不对称方包，或用一件斜门襟上衣作为重点。]
      natural:
        keep_zh: [保留棉斜纹面料与简洁系带鞋。]
        add_zh: [把合肩夹克换成微落肩衬衫外套，加入一只中号帆布包。]

  modern:
    name_zh: 前卫型
    summary_zh: 清晰几何线条与一处错位细节，让整体呈现鲜明、有变化的视觉重点。
    keywords_zh: [几何, 错位, 局部对比]
    rules_zh:
      fabric: 选紧密棉布、细纹皮革感面料或挺括针织，每套用一处光泽与哑光对照。
      silhouette: 用清楚的直线轮廓承接一处不对称剪裁，斜门襟与错位下摆二选一。
      pattern: 选中小尺度几何块面、斜线或留白明显的拼接，避免全套同时分割。
      accessories: 选几何耳饰、方形戒指或结构小包，每套指定一件作为重点。
      neckline: 选斜领、窄立领或清晰方领，其他部位减少装饰以保留领口形状。
      hair_hint: 按原长度做清楚侧分或直线发尾，可用发夹制造一侧贴顺的效果。
      makeup_hint: 如使用彩妆，在短眼线、清晰眉尾或一处唇色中选一个重点，颜色从个人色卡取。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 不对称上衣配直身裙或直筒裤，把错位细节集中在上半套。
          accessories: 一枚几何耳饰配结构小包，包与耳饰不同时采用复杂拼接。
          hair_hint: 短发保留整齐发尾，长发可侧分后把一侧别至耳后，先用发夹尝试形状。
          makeup_hint: 可画一段短而清楚的眼尾线，唇部用柔和薄涂，让眼尾成为唯一重点。
        examples_zh:
          - 斜领针织上衣 + 直身半裙 + 几何耳饰
          - 短款结构夹克 + 素面直筒裤 + 方头平底鞋
          - 错位下摆衬衫 + 窄直裙 + 小号结构包
        avoid_zh:
          - 若想看清剪裁，不对称领口、斜门襟与复杂拼接先选一种，其余用素面直线单品。
      masculine:
        rules_zh:
          silhouette: 结构短夹克配直筒裤，可把一处拉链或斜袋作为视觉重点。
          accessories: 选方形戒指或结构腰包，扣件形状与外套线条呼应。
          hair_hint: 短发用原分线吹出清楚侧向，中长发可把一侧别顺，保持发尾直线。
          makeup_hint: 如想加理容细节，可固定眉毛走向并整理已有胡须边缘；需要颜色时只加少量唇色。
        examples_zh:
          - 斜拉链短夹克 + 窄立领内搭 + 直筒裤
          - 几何拼接针织衫 + 素面棉裤 + 方形戒指
          - 结构马甲 + 平整衬衫 + 简洁系带鞋
        avoid_zh:
          - 若想突出一个重点，大面积金属链与多处亮面先二选一，余下改为哑光。
      neutral:
        rules_zh:
          silhouette: 直身上衣配直筒长裤，用错位衣摆或单侧口袋改变一个局部。
          accessories: 选几何胸针或结构斜挎包，保持一件主配饰。
          hair_hint: 长发可扎平整低马尾并留一条清楚分线，短发将一侧压顺、另一侧顺势吹起。
          makeup_hint: 可把眉尾梳出明确方向；想尝试彩妆时，只在眼尾或唇部选一处色卡色。
        examples_zh:
          - 错位下摆棉上衣 + 直筒长裤 + 几何胸针
          - 窄立领衬衫 + 短款结构马甲 + 方形斜挎包
          - 斜线拼接针织衫 + 素面九分裤 + 简洁短靴
        avoid_zh:
          - 若想保留几何秩序，圆点、碎花与斜线拼接不同时混用，选一个图案主题即可。
    transitions_to:
      natural:
        keep_zh: [保留直筒下装与单件重点配饰。]
        add_zh: [把紧密亮面外套换成棉麻衬衫外套，放松肩线并减少一处拼接。]
      boyish:
        keep_zh: [保留短外套与清晰小尺度几何细节。]
        add_zh: [把斜门襟换成对称衬衫领，再用小方包与帆布鞋衔接。]

  elegant:
    name_zh: 优雅型
    summary_zh: 中等尺度的柔和曲线与流畅垂感，构成安静、细致的视觉印象。
    keywords_zh: [流畅, 柔和, 细致]
    rules_zh:
      fabric: 选垂感绉布、细针织或哑光缎面，让衣片自然下落，先用一件带柔光的单品。
      silhouette: 选顺着衣片自然下落的轮廓，以轻弧接缝或柔和垂褶替代多层堆叠。
      pattern: 选小到中等的柔边花纹或浅淡水纹，图案单品配素面下装。
      accessories: 选细链、小珍珠或弧形金属配件，每套留一至两件。
      neckline: 选浅弧领、柔和翻领或窄开口领，领边平整并保留适度留白。
      hair_hint: 按现有长度把发尾吹出一段连续弧线，分线自然，不必叠加多层卷度。
      makeup_hint: 如使用彩妆，从个人色卡选柔和唇色与腮红，薄涂并把边缘晕开。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 垂感衬衫配轻收腰半裙，或用短开衫搭直身连衣裙，腰部只保留一处柔和转折。
          accessories: 细链或小珍珠耳饰选一件，配中小号圆角包。
          hair_hint: 锁骨附近长度可向内吹出一段弧度，长发可松扎低髻并整理耳侧发丝。
          makeup_hint: 可将色卡内柔和腮红薄薄晕开，唇部用相近色族，眉毛顺着原走向轻补。
        examples_zh:
          - 垂感开领衬衫 + 轻收腰半裙 + 细链
          - 细针织短开衫 + 直身连衣裙 + 圆角小包
          - 柔边花纹上衣 + 素面直筒裤 + 小珍珠耳饰
        avoid_zh:
          - 若想保持连续垂感，硬挺宽肩外套与多层硬褶先不同时加入，可换成柔和翻领外套。
      masculine:
        rules_zh:
          silhouette: 柔肩西装配垂感直筒裤，上衣合肩但不绷紧，开衫下摆保持平顺。
          accessories: 用细表带、素面皮带或小方巾，方巾只露出一小段。
          hair_hint: 中短发依原分线吹顺，顶部留柔和起伏，发梢不要抓成尖束。
          makeup_hint: 如有理容习惯，可梳顺眉毛并整理已有胡须，唇部选透明或低浓度润色。
        examples_zh:
          - 柔肩单西 + 细针织圆领上衣 + 垂感直筒裤
          - 柔和开领衬衫 + 素面长裤 + 细表带腕表
          - 细针织开衫 + 平整衬衫 + 简洁便鞋
        avoid_zh:
          - 若想保留柔和轮廓，粗链与大号硬质扣件不同时使用，可保留一条细表带。
      neutral:
        rules_zh:
          silhouette: 垂感直身衬衫配宽直裤，衣片保留自然弧度，外搭用柔肩剪裁。
          accessories: 选窄织带腕表或弧形胸针，再配中号素面软包。
          hair_hint: 长发沿原分线梳顺后松扎，短发用圆梳带出轻弧，不要求改变原有长度。
          makeup_hint: 可只把眉毛梳齐；想加颜色时，在唇部薄涂色卡内柔和色，边缘轻轻晕开。
        examples_zh:
          - 垂感直身衬衫 + 宽直长裤 + 弧形胸针
          - 柔肩长开衫 + 素面圆领内搭 + 中号软包
          - 细针织上衣 + 柔软直筒裤 + 窄织带腕表
        avoid_zh:
          - 若想突出柔和线条，多个锐角配饰与大块硬拼接先减少一种，让垂感面料成为重点。
    transitions_to:
      classic:
        keep_zh: [保留细密面料、适量配饰与平整领边。]
        add_zh: [把柔边花纹换成细条纹，加入一件肩线明确的小翻领外套。]
      sweet:
        keep_zh: [保留柔和弧线与小号圆润配件。]
        add_zh: [把长开衫换成短开衫，用一处小圆点或圆角领增加轻巧细节。]
      romantic:
        keep_zh: [保留柔和垂感与连续的曲线。]
        add_zh: [把细链换成中号弧形吊坠，再加入一件有大幅垂褶的上衣。]

  classic:
    name_zh: 古典型
    summary_zh: 中等尺度、对称结构与平整细节，呈现有序、克制的视觉印象。
    keywords_zh: [对称, 平整, 有序]
    rules_zh:
      fabric: 选精纺羊毛、平纹棉或细密针织，保持表面平整与清楚接缝。
      silhouette: 选合肩外套和直线下装，用清楚的门襟、中线与等量留白组织全套。
      pattern: 从素面、细条纹或中小尺度规则格纹开始，一套只放一种图案。
      accessories: 选中小号皮带扣、素面腕表或规则形状耳饰，五金颜色保持一致。
      neckline: 选对称衬衫领、小翻领或规整圆领，领片两侧保持平齐。
      hair_hint: 依原有分线梳齐发丝，轮廓完整，发尾方向保持一致。
      makeup_hint: 如使用彩妆，眉毛、唇部边缘沿原轮廓轻补，颜色从个人色卡选低到中等浓度。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 合肩单西配直筒裤或直身裙，腰线与门襟平整，扣子与口袋保持对称。
          accessories: 小号规则耳钉与细表带可组合，方包五金与皮带扣保持同色。
          hair_hint: 肩部长度可将发尾统一向内吹，长发可扎整齐低马尾并梳顺耳侧。
          makeup_hint: 可按原眉形轻补空隙，唇色沿原唇线薄涂，眼妆只保留一层低光泽色。
        examples_zh:
          - 合肩单西 + 素面衬衫 + 直筒长裤
          - 对称门襟连衣裙 + 短开衫 + 小号规则耳钉
          - 细条纹衬衫 + 直身半裙 + 素面方包
        avoid_zh:
          - 若想保持对称秩序，错位门襟与不规则大图案先不同时使用，可用素面衬衫衔接。
      masculine:
        rules_zh:
          silhouette: 合肩两粒扣外套配中线裤，衬衫门襟平整，裤脚停在鞋面附近。
          accessories: 素面腕表与中小号皮带扣搭配，正式场合可加窄幅素面领带。
          hair_hint: 短发梳出自然侧分并把两侧整理顺，中长发可低扎，发梢保持同一走向。
          makeup_hint: 如有理容习惯，沿原形整理眉毛与已有胡须边缘，唇部保留透明质地。
        examples_zh:
          - 两粒扣单西 + 对称领衬衫 + 中线直筒裤
          - 细针织圆领衫 + 素面长裤 + 窄皮带
          - 规则小格衬衫 + 平纹棉裤 + 素面腕表
        avoid_zh:
          - 若想突出平整结构，多袋工装外套与堆叠裤脚先减少一种，裤脚可折到整齐长度。
      neutral:
        rules_zh:
          silhouette: 直身合肩外套配中线长裤，内搭领口居中，衣摆与袖口保持平齐。
          accessories: 规则形状胸针或中小号方包选一件，扣件与腕表用同色五金。
          hair_hint: 按现有长度整理出清楚分线，长发低扎并把散落发丝别好，短发两侧梳齐。
          makeup_hint: 可用透明眉胶保持毛流整齐，想用唇色时薄涂一种色卡色并整理边缘。
        examples_zh:
          - 直身合肩外套 + 中线长裤 + 素面系带鞋
          - 规整圆领针织衫 + 对称口袋衬衫 + 中号方包
          - 细条纹直身上衣 + 素面九分裤 + 规则胸针
        avoid_zh:
          - 若想保留有序感，多种五金颜色与多组图案先统一一种，余下换成素面。
    transitions_to:
      natural:
        keep_zh: [保留直筒下装、素面配件与清楚领边。]
        add_zh: [把合肩精纺外套换成微落肩棉麻外套，换一只中号软包。]
      elegant:
        keep_zh: [保留细密面料与中小号配饰。]
        add_zh: [把规整衬衫领换成柔和开领，用垂感面料替换一件硬挺单品。]

  natural:
    name_zh: 自然型
    summary_zh: 舒展的直线轮廓与可见织物纹理，带来松弛、质朴的视觉印象。
    keywords_zh: [舒展, 织物纹理, 松弛]
    rules_zh:
      fabric: 选棉麻、斜纹棉、粗细适中的针织或软牛仔，每套先用一种明显纹理。
      silhouette: 用微落肩上衣与直筒下装，衣片留出活动空间，袖口和裤脚整理清楚。
      pattern: 选宽度适中的条纹、稀疏格纹或素面，让织物纹理代替密集装饰。
      accessories: 选中号帆布包、编织带或哑光金属配件，尺寸与外套宽度呼应。
      neckline: 选自然敞开的衬衫领、宽度适中的圆领或短开口领，不层叠多种领边。
      hair_hint: 顺着原发流吹干，保留少量自然纹理，只整理挡住视线的发丝与散乱发尾。
      makeup_hint: 如使用彩妆，选低光泽质地薄涂，眉毛顺势梳齐，颜色从个人色卡取。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 微落肩衬衫配直身长裙或宽直裤，领口与袖口稍作整理，让面料舒展。
          accessories: 中号编织包配一件哑光耳饰，避免配件同时出现多层流苏。
          hair_hint: 中长发按原有纹理吹干，可松扎低马尾并留少量耳侧发丝，短发用手指理顺。
          makeup_hint: 可薄涂色卡内低光泽唇色，腮红以大软刷轻扫一层，眉毛保留毛流。
        examples_zh:
          - 棉麻开领衬衫 + 直身长裙 + 中号编织包
          - 微落肩针织衫 + 宽直长裤 + 哑光耳饰
          - 软牛仔衬衫外套 + 素面连衣裙 + 平底便鞋
        avoid_zh:
          - 若想保持舒展，窄硬衣片与密集小装饰先减少一种，可把上衣换成柔软棉麻。
      masculine:
        rules_zh:
          silhouette: 微落肩棉外套配直筒工装裤，口袋数量适中，裤脚整理到鞋面附近。
          accessories: 中号帆布包配织带腕表，金属扣件以哑光表面为主。
          hair_hint: 短发用手指沿发流吹干，保留顶部自然纹理，耳侧整理清楚即可。
          makeup_hint: 如有理容习惯，可梳齐眉毛，已有胡须整理成均匀长度，唇部选透明质地。
        examples_zh:
          - 棉斜纹衬衫外套 + 圆领内搭 + 直筒工装裤
          - 粗针织开衫 + 素面长裤 + 织带腕表
          - 软牛仔上衣 + 直筒棉裤 + 中号帆布包
        avoid_zh:
          - 若想突出织物纹理，全套亮面与多组金属配件先减少一种，让棉麻或针织成为重点。
      neutral:
        rules_zh:
          silhouette: 直身棉麻上衣配宽直裤，用卷袖一折或平整裤脚明确边界。
          accessories: 选中号帆布托特包或编织腰带，另一处配件保持素面。
          hair_hint: 按原有纹理自然吹干，长发可松扎在颈后，短发只理顺两侧发丝。
          makeup_hint: 可只梳顺眉毛；如想润色，薄涂一层色卡内低光泽唇色，不叠加多个重点。
        examples_zh:
          - 直身棉麻上衣 + 宽直长裤 + 帆布托特包
          - 稀疏条纹衬衫 + 直筒牛仔裤 + 编织腰带
          - 微落肩针织外套 + 素面内搭 + 简洁便鞋
        avoid_zh:
          - 若想保留清楚轮廓，多层宽大上衣与拖地裤先不同时叠穿，可整理一处衣摆或裤脚。
    transitions_to:
      modern:
        keep_zh: [保留直线轮廓与单件纹理面料。]
        add_zh: [把软包换成结构方包，或加入一件只有一处斜线拼接的上衣。]
      classic:
        keep_zh: [保留素面内搭与直筒裤。]
        add_zh: [把落肩外套换成合肩小翻领外套，将袖口与裤脚整理平齐。]
      dramatic:
        keep_zh: [保留舒展直线与简洁图案。]
        add_zh: [把短外套换成轮廓明确的长外套，用一只大号结构包增加量感。]

  romantic:
    name_zh: 浪漫型
    summary_zh: 较大尺度的曲线、垂褶与柔光，营造丰沛、流动的视觉印象。
    keywords_zh: [流动, 大幅曲线, 柔光]
    rules_zh:
      fabric: 选垂感绉布、厚度适中的缎面或细绒面，用一件柔光面料与哑光单品搭配。
      silhouette: 用大幅垂褶、弧形接缝或流动下摆组织轮廓，每套只集中一处主要曲线。
      pattern: 选中到大尺度的柔边花纹、水纹或弧线图案，与素面单品相接。
      accessories: 选中大号弧形耳饰、圆润吊坠或弧形软包，让一件配饰承担重点。
      neckline: 选垂褶领、宽弧领或柔和开领，领口与配饰之间留出空隙。
      hair_hint: 按现有长度吹出连续的大弧度，长发可分大束整理，短发保留圆润走向。
      makeup_hint: 如使用彩妆，可选色卡内中等浓度唇色，腮红柔和晕开，眼唇只选一处加强。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 垂褶上衣配素面长裙，或用弧线接缝连衣裙作主角，袖口不再叠加多层装饰。
          accessories: 中号弧形耳饰配素面软包，耳饰与吊坠先二选一。
          hair_hint: 肩下长发用圆梳分大束吹出弧线，也可用发夹把现有长发松挽成低髻。
          makeup_hint: 可用色卡内中等浓度唇色作重点，腮红轻晕，眼妆只留低光泽底色。
        examples_zh:
          - 垂褶领上衣 + 素面长裙 + 弧形耳饰
          - 弧线接缝连衣裙 + 素面软包 + 简洁平底鞋
          - 柔边大花衬衫 + 垂感直筒裤 + 圆润吊坠
        avoid_zh:
          - 若想看清流动线条，大花、亮面与多层垂褶先选一项作重点，其余换成素面。
      masculine:
        rules_zh:
          silhouette: 柔肩长外套配垂感宽直裤，开领衬衫只留一处柔和垂褶。
          accessories: 中号圆润吊坠或弧形戒指选一件，搭配素面软质手袋。
          hair_hint: 中长发沿原分线吹出一段较大弧度，短发顶部可顺着发流做圆润起伏。
          makeup_hint: 如想加理容或润色，可梳顺眉毛并保留柔和边缘，唇部薄涂色卡内中等浓度色。
        examples_zh:
          - 柔和开领衬衫 + 垂感宽直裤 + 弧形戒指
          - 柔肩长外套 + 细绒面内搭 + 素面手袋
          - 水纹衬衫 + 素面长裤 + 圆润吊坠
        avoid_zh:
          - 若想保留大幅曲线，小碎格与多条硬质细带先减少一种，让一件垂感衣片充分展开。
      neutral:
        rules_zh:
          silhouette: 垂感直身上衣配宽直裤，加入一处宽弧下摆或柔软长围巾延续曲线。
          accessories: 中大号弧形胸针或圆润软包选一件，其他配件减少层数。
          hair_hint: 按原长度梳出连续弧线，长发可松扎后留出一段圆润发尾，短发轻吹顶部即可。
          makeup_hint: 可将眉毛顺势梳齐，想加色时只加强唇部，选择色卡内柔和边缘的中等浓度色。
        examples_zh:
          - 宽弧领垂感上衣 + 宽直长裤 + 圆润软包
          - 柔肩长开衫 + 素面内搭 + 弧形胸针
          - 水纹直身衬衫 + 垂感长裤 + 柔软长围巾
        avoid_zh:
          - 若想让曲线成为重点，多处锐角配件与硬挺拼接先减少一种，用素面软包衔接。
    transitions_to:
      elegant:
        keep_zh: [保留垂感面料与柔和领口。]
        add_zh: [把大幅垂褶换成轻微垂褶，将中大号耳饰换成细链或小耳饰。]
      classic:
        keep_zh: [保留细密面料与单件重点配饰。]
        add_zh: [用对称翻领外套搭配现有垂感内搭，再加入中线清楚的直筒裤。]

  dramatic:
    name_zh: 戏剧型
    summary_zh: 大尺度的直线轮廓与鲜明边界，形成集中、有张力的视觉印象。
    keywords_zh: [大尺度, 清晰边界, 张力]
    rules_zh:
      fabric: 选挺括呢料、紧密棉布或有支撑的斜纹面料，用一处光泽变化强调结构。
      silhouette: 用长直线外套、明确肩线或大块衣片建立轮廓，全套只保留一个主要体积重点。
      pattern: 选大尺度几何块面、宽条纹或整片素面，图案边界清楚并保留留白。
      accessories: 选大号结构包、宽手镯或长直线耳饰，每套用一件主配饰。
      neckline: 选长开领、宽翻领或轮廓清楚的立领，让领口与外套线条连贯。
      hair_hint: 按现有长度吹出清楚分线与完整外轮廓，长发可扎整齐低马尾，短发整理顶部走向。
      makeup_hint: 如使用彩妆，可用色卡内较鲜明的一种唇色或一条清楚眼线，其余部位保持简洁。
    by_presentation:
      feminine:
        rules_zh:
          silhouette: 明确肩线长外套配直身裙或长直裤，用一件大衣建立长线条。
          accessories: 长直线耳饰或宽手镯选一件，包用大块素面结构。
          hair_hint: 长发可梳整齐低马尾并留清楚分线，肩部长度把发尾吹直，保留完整外轮廓。
          makeup_hint: 可在清楚眼线与鲜明唇色中选一个重点，另一处用色卡内低浓度色衔接。
        examples_zh:
          - 宽翻领长外套 + 直身长裙 + 长直线耳饰
          - 明确肩线单西 + 长直裤 + 大号结构包
          - 大块几何上衣 + 素面长裙 + 宽手镯
        avoid_zh:
          - 若想保留集中重点，大耳饰、宽腰带与大花纹先选一项，其他单品减少装饰。
      masculine:
        rules_zh:
          silhouette: 挺括长外套配宽直长裤，肩线清楚，内搭与外套形成连续直线。
          accessories: 大号结构手袋或宽表带选一件，其他五金保持素面。
          hair_hint: 短发沿原发流把顶部吹出明确走向，中长发可后梳或低扎，耳侧整理平顺。
          makeup_hint: 如有理容习惯，可把眉毛走向与已有胡须边缘整理清楚，唇部用透明或低浓度润色。
        examples_zh:
          - 挺括长外套 + 立领衬衫 + 宽直长裤
          - 宽翻领单西 + 素面内搭 + 大号结构手袋
          - 宽条纹针织衫 + 长直裤 + 宽表带腕表
        avoid_zh:
          - 若想突出长直线，多层短小衣摆与密集小挂件先减少一组，让外套轮廓连续。
      neutral:
        rules_zh:
          silhouette: 结构长马甲或长外套配直筒裤，上下衣片以大块素面相接。
          accessories: 用大号方包或长线胸针作为主角，其他配件保持小而简洁。
          hair_hint: 按原长度整理清楚分线，短发保留整片方向，中长发可平整低扎并理顺发尾。
          makeup_hint: 可只梳出清楚眉毛走向；若想加彩妆，在眼尾直线与色卡内鲜明唇色中选一处。
        examples_zh:
          - 结构长马甲 + 素面衬衫 + 直筒长裤
          - 清晰立领长外套 + 素面内搭 + 大号方包
          - 大块几何针织衫 + 宽直长裤 + 长线胸针
        avoid_zh:
          - 若想突出清楚边界，小碎花与层叠褶边先不同时加入，可保留一块素面衣片。
    transitions_to:
      natural:
        keep_zh: [保留舒展直线与中大号包。]
        add_zh: [把硬挺长外套换成微落肩棉外套，用哑光织物替换亮面单品。]
      modern:
        keep_zh: [保留清楚肩线与几何配件。]
        add_zh: [把长外套换成短结构夹克，把大块图案缩到单侧口袋或一处斜门襟。]
