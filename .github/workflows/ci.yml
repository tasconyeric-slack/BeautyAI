name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - name: Install
        run: pip install -e ".[pipeline,api,dev]"
      - name: MediaPipe models
        run: make models
      - name: Lint
        run: make lint
      - name: Tests (no API keys; face-photo tests skip without data/test_faces)
        run: make test
      - name: Fixture is up to date
        run: make sample && git diff --exit-code examples web/lib/fixtures

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types are generated from the schema
        run: node scripts/gen-types.mjs && git diff --exit-code lib/passport.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
