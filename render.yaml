# Render blueprint for the API. The web app goes to Vercel (see README → 部署).
services:
  - type: web
    name: aesthetic-passport-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Rendering real-photo AI previews and CV inference exceeded the Free 512 MiB limit (2026-10-28 OOM).
    # Standard provides 2 GiB. The disk is essential for retaining SQLite and media after restarts.
    # NOTE: Updating this file alone does NOT reconfigure an existing non-Blueprint Render service.
    plan: standard              # legacy name for 1c-2g (2 GiB RAM)
    healthCheckPath: /api/health
    disk:
      name: runs
      mountPath: /data          # SQLite job store + 24 h media (RUNS_DIR=/data/runs)
      sizeGB: 1
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false             # optional; Beijing workspace endpoint, https://<WorkspaceId>.cn-beijing.maas.aliyuncs.com/api/v1
      - key: ANALYSIS_PROVIDER
        value: auto
      - key: IMAGE_EDIT_PROVIDER
        value: auto
      - key: WEB_ORIGINS
        sync: false             # e.g. https://aesthetic-passport.vercel.app
      - key: INVITE_CODES
        sync: false
      - key: DAILY_PASSPORT_LIMIT
        value: "30"
      - key: IP_PASSPORTS_PER_HOUR
        value: "5"
      - key: IP_HASH_SALT
        generateValue: true
